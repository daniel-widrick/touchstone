<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Component library patterns - fixture</title>
<style>
  /* Patterns from component libraries that ux-check used to misreport. ux-check should report no failures here. */
  body { font: 16px/1.5 system-ui, sans-serif; margin: 24px; color: #1f2937; background: #fff; }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  .select-host { display: inline-block; min-width: 180px; min-height: 36px; border: 1px solid #6b7280; border-radius: 6px; }
  .select-host .trigger { cursor: pointer; padding: 6px 10px; }
  .accordion-header { display: block; min-height: 36px; padding: 6px 10px; border: 1px solid #6b7280; border-radius: 6px; margin-top: 12px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; font-size: 10px; color: #ccc; }
  button { font: inherit; min-height: 36px; padding: 6px 14px; border: 1px solid #6b7280; border-radius: 6px; background: #fff; color: #1f2937; }
  button:disabled { color: #c4c4c4; border-color: #e5e5e5; }
  .never-rendered-widget { transition: all 2s; }
  .never-rendered-widget:hover { transition: width 3s; }
  .spinner { width: 24px; height: 24px; border: 3px solid #93c5fd; border-top-color: #1d4ed8; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  i.icon { display: inline-block; width: 16px; height: 16px; background: #1d4ed8; vertical-align: middle; }
</style>
</head>
<body>
<main>
<h1>Component library patterns</h1>

<h2>Select whose host carries the role</h2>
<div class="select-host" role="combobox" tabindex="0" aria-label="Fruit" aria-expanded="false"
     onkeydown="void 0"><div class="trigger" onclick="void 0">Apple</div></div>

<h2>Accordion header in a shadow root</h2>
<accordion-header-x></accordion-header-x>

<h2>Grid with screen-reader instructions</h2>
<table>
  <thead><tr><th scope="col">Name <span class="sr-only">Use left or right key to resize the column</span></th><th scope="col">Size</th></tr></thead>
  <tbody><tr><td>report.pdf</td><td>2 MB</td></tr></tbody>
</table>

<h2>Disabled control</h2>
<p><button type="button" disabled>Export unavailable</button></p>

<h2>Icon font element</h2>
<p><i class="icon" aria-hidden="true"></i> Synced</p>

<h2>Content that arrives after a spinner</h2>
<div id="late"><div class="spinner" role="progressbar" aria-label="Loading"></div></div>
</main>
<script>
  customElements.define('accordion-header-x', class extends HTMLElement {
    connectedCallback() {
      this.setAttribute('role', 'button');
      this.setAttribute('tabindex', '0');
      this.setAttribute('aria-expanded', 'false');
      this.className = 'accordion-header';
      this.addEventListener('keydown', () => {});
      const root = this.attachShadow({ mode: 'open' });
      root.innerHTML = '<div style="cursor:pointer" part="label">Shipping details</div>';
      root.firstChild.onclick = () => {};
    }
  });
  // Replaces the spinner after 1.5 s. Measured too early, the page is a spinner; measured after
  // it settles, the late content (a real link) is what gets checked.
  setTimeout(() => { document.getElementById('late').innerHTML = '<p><a href="/reports">All reports</a></p>'; }, 1500);
</script>
</body>
</html>
