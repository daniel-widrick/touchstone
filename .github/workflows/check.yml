name: check

on:
  push:
  pull_request:

jobs:
  rules:
    name: Rules, build and checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod

      - name: Validate rules and rebuild the generated files
        working-directory: tools
        run: go run . build

      - name: Generated files are committed and up to date
        run: |
          if ! git diff --exit-code; then
            echo "Run 'cd tools && go run . build' and commit the result."
            exit 1
          fi

      - name: No typographic dashes in the rules or the plugin
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' rules plugin sources/registry.yaml; then
            echo "Use an ASCII hyphen, a comma, or reword."
            exit 1
          fi

      - name: Checker finds the planted defects and passes the clean page
        run: |
          python3 -m py_compile plugin/skills/touchstone/scripts/run.py
          bad=$(python3 plugin/skills/touchstone/scripts/run.py -s fixtures/mechanical/bad.html | grep -c '^fail' || true)
          good=$(python3 plugin/skills/touchstone/scripts/run.py -s fixtures/mechanical/good.html | grep -c '^fail' || true)
          echo "bad.html: $bad failing checks; good.html: $good failing checks"
          test "$bad" -ge 40
          test "$good" -eq 0
          for f in framework login; do
            n=$(python3 plugin/skills/touchstone/scripts/run.py -s fixtures/mechanical/$f.html | grep -c '^fail' || true)
            echo "$f.html: $n failing checks"
            test "$n" -eq 0
          done
          python3 plugin/skills/touchstone/scripts/run.py fixtures/mechanical/overlap.html > /tmp/overlap.json
          python3 - <<'PY'
          import json
          c = json.load(open("/tmp/overlap.json"))["checks"]
          print("overlap.html: fixed-overlap", c["fixed-overlap"]["status"], c["fixed-overlap"]["count"], "| visible-label", c["visible-label"]["status"], c["visible-label"]["count"])
          assert c["fixed-overlap"]["status"] == "review" and c["fixed-overlap"]["count"] >= 5
          assert c["visible-label"]["status"] == "fail" and c["visible-label"]["count"] == 1
          PY
