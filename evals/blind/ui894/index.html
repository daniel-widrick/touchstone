<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team settings</title>
<style>
  :root {
    color-scheme: light dark;
    --surface: #f4f7fb;
    --surface-raised: #fcfeff;
    --text: #141b24;
    --text-muted: #515963;
    --border: #d3d8de;
    --border-strong: #707883;
    --accent: #0c54a0;
    --on-accent: #fcfeff;
    --accent-soft: #dbe9fc;
    --danger: #b02a2d;
    --success: #146d34;
    --scrim: rgba(12, 16, 21, 0.55);

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.25rem; --text-xl: 1.5rem;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --control-h: 40px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #0c1015;
      --surface-raised: #14191f;
      --text: #e4e8ed;
      --text-muted: #9ea5ae;
      --border: #2a2e34;
      --border-strong: #707883;
      --accent: #8cbaf7;
      --on-accent: #0c1015;
      --accent-soft: #1b2a3c;
      --danger: #f7857d;
      --success: #6fd087;
      --scrim: rgba(0, 0, 0, 0.65);
    }
  }
  @media (max-width: 640px), (pointer: coarse) {
    :root { --control-h: 44px; }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text);
    font: 400 var(--text-base)/1.5 var(--font);
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: var(--s6) var(--s5) var(--s7);
  }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: var(--text-xl); line-height: 1.25; font-weight: 600; }
  h2 { font-size: var(--text-lg); line-height: 1.3; font-weight: 600; }
  h1:focus, h2:focus { outline: none; }
  h1:focus-visible, h2:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  section {
    margin-top: var(--s6);
    padding-top: var(--s5);
    border-top: 1px solid var(--border);
  }
  .section-head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: var(--s1) var(--s4);
    margin-bottom: var(--s4);
  }
  .count { color: var(--text-muted); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }

  /* Controls */
  label, .label { display: block; font-size: var(--text-sm); font-weight: 600; margin-bottom: var(--s1); }
  input[type="text"], input[type="email"], select {
    width: 100%;
    min-height: var(--control-h);
    padding: 0 var(--s3);
    font: inherit;
    color: var(--text);
    background: var(--surface-raised);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
  }
  input[aria-invalid="true"] { border-color: var(--danger); border-width: 2px; }
  .btn {
    display: inline-grid; align-items: center; justify-items: center;
    min-height: var(--control-h);
    padding: 0 var(--s4);
    font: 600 var(--text-sm)/1.2 var(--font);
    white-space: nowrap;
    color: var(--text);
    background: var(--surface-raised);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    cursor: pointer;
  }
  .btn > span { grid-area: 1 / 1; }
  .btn .busy-label { visibility: hidden; }
  .btn.busy .idle-label { visibility: hidden; }
  .btn.busy .busy-label { visibility: visible; }
  .btn.busy { cursor: progress; }
  .btn:hover { background: var(--accent-soft); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: color-mix(in oklab, var(--accent) 86%, var(--text)); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }
  .btn.danger:hover { background: color-mix(in oklab, var(--danger) 86%, var(--text)); }
  .btn.small { min-height: 32px; padding: 0 var(--s3); }
  @media (max-width: 640px), (pointer: coarse) {
    .btn.small { min-height: 44px; }
  }

  .field-error, .error { color: var(--danger); font-size: var(--text-base); }
  .field-error:not(:empty)::before, .error:not(:empty)::before { content: "! "; font-weight: 600; }
  .field-error:not(:empty) { margin-top: var(--s1); }
  .status { color: var(--text-muted); font-size: var(--text-sm); }
  .status.done { color: var(--success); }
  .status.done:not(:empty)::before { content: "\2713\00a0"; }

  .spin {
    display: inline-block; width: 14px; height: 14px; margin-right: var(--s2);
    vertical-align: -2px;
    border: 2px solid var(--border-strong); border-top-color: var(--accent); border-radius: 50%;
  }
  @media (prefers-reduced-motion: no-preference) {
    .spin { animation: spin 0.8s linear infinite; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Load */
  #load { margin-top: var(--s6); padding-top: var(--s5); border-top: 1px solid var(--border); min-height: 60vh; }
  #load-error:not(:empty) { margin-bottom: var(--s3); font-size: var(--text-base); }

  /* Invite */
  .invite h3 { font-size: var(--text-base); line-height: 1.5; font-weight: 600; margin-bottom: var(--s2); }
  .invite form {
    display: grid;
    grid-template-columns: minmax(0, 24rem) 10rem auto;
    grid-template-areas: "el rl ." "ei ri b" "ee ee ee";
    column-gap: var(--s3);
    justify-content: start;
    align-items: start;
  }
  #invite-email-label { grid-area: el; }
  #invite-email { grid-area: ei; }
  #invite-email-error { grid-area: ee; }
  #invite-role-label { grid-area: rl; }
  #invite-role { grid-area: ri; }
  #invite-submit { grid-area: b; }
  .seats-full { margin-top: var(--s2); font-size: var(--text-sm); }
  .members-msg { min-height: 1.5rem; margin: var(--s3) 0; }

  /* Members table */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted);
    padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border-strong);
  }
  tbody th, tbody td {
    text-align: left; vertical-align: top; font-weight: 400;
    padding: var(--s3); border-bottom: 1px solid var(--border);
  }
  thead th:first-child, tbody th { padding-left: 0; }
  thead th:last-child, tbody td:last-child { padding-right: 0; }
  tbody tr:last-child > * { border-bottom: 0; }
  tbody tr.fresh > * { background: var(--accent-soft); }
  tbody tr.fresh th { padding-left: var(--s3); }
  .who { overflow-wrap: anywhere; min-width: 0; }
  .who .name { display: block; font-weight: 600; }
  .who .email { display: block; color: var(--text-muted); font-size: var(--text-sm); }
  .col-role { width: 15rem; }
  .col-active { width: 9rem; }
  .col-act { width: 6rem; }
  td.active { font-size: var(--text-sm); white-space: nowrap; font-variant-numeric: tabular-nums; padding-top: calc(var(--s3) + (var(--control-h) - 1.3125rem) / 2); }
  td.role-fixed { padding-top: calc(var(--s3) + (var(--control-h) - 1.5rem) / 2); }
  tbody th { padding-top: var(--s3); }
  td.act { text-align: right; }
  .role-line { display: flex; align-items: center; gap: var(--s3); }
  .role-line select { width: 7.5rem; flex: none; }
  .role-line .status { min-width: 4.5rem; white-space: nowrap; }
  .cell-label { display: none; }
  .row-error { margin-top: var(--s2); }
  .row-error .btns { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s2); }
  .empty { padding: var(--s4) 0; color: var(--text-muted); border-top: 1px solid var(--border-strong); }

  @media (max-width: 640px) {
    main { padding: var(--s5) var(--s4) var(--s7); }
    .invite form { display: block; }
    .invite form label { margin-top: var(--s3); }
    #invite-email-label { margin-top: 0; }
    #invite-submit { margin-top: var(--s4); width: 100%; }

    table, tbody, tbody th, tbody td { display: block; }
    tbody tr {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--s3);
      grid-template-areas: "who who" "active active" "role act";
    }
    tbody th { grid-area: who; }
    td.active { grid-area: active; }
    td.role, td.role-fixed { grid-area: role; }
    td.act { grid-area: act; }
    td.role + td + td.act { padding-top: calc(1.3125rem + var(--s1)); }
    thead {
      position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%);
    }
    tbody { border-top: 1px solid var(--border-strong); }
    tbody tr { padding: var(--s3) 0 var(--s4); border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: 0; }
    tbody tr.fresh { padding-left: var(--s3); padding-right: var(--s3); background: var(--accent-soft); }
    tbody tr.fresh th { padding-left: 0; }
    tbody th, tbody td, td.active, td.role-fixed { padding: 0; border: 0; width: auto; }
    tbody td { margin-top: var(--s2); }
    tbody td.role, tbody td.role + td + td.act { margin-top: var(--s3); }
    td.act:empty { display: none; }
    .cell-label { display: block; font-size: var(--text-sm); font-weight: 600; color: var(--text); margin-bottom: var(--s1); }
    span.cell-label { display: inline; font-weight: 400; color: var(--text-muted); margin: 0; }
    .role-line select { width: 8.5rem; }
    .role-line { gap: var(--s2); }
  }

  /* Team name */
  .name-form { max-width: 28rem; }
  .name-form .actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin-top: var(--s3); min-height: var(--control-h); }

  /* Notifications */
  .notif { list-style: none; margin: 0; padding: 0; }
  .notif li { padding: var(--s1) 0; }
  .notif .line { display: flex; align-items: center; gap: var(--s4); min-height: var(--control-h); }
  .notif label {
    display: flex; align-items: center; gap: var(--s3);
    margin: 0; min-height: var(--control-h); min-width: 14rem;
    font-size: var(--text-base); font-weight: 400; cursor: pointer;
  }
  .notif input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--accent); }

  /* Dialog */
  dialog {
    width: 28rem; max-width: calc(100vw - 32px);
    padding: var(--s5);
    color: var(--text); background: var(--surface-raised);
    border: 1px solid var(--border-strong); border-radius: 8px;
  }
  dialog::backdrop { background: var(--scrim); }
  dialog h2 { overflow-wrap: anywhere; margin-bottom: var(--s2); }
  dialog .error:not(:empty) { margin-top: var(--s3); }
  dialog .btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s3); margin-top: var(--s5); }
</style>
</head>
<body>
<main>
  <h1 id="page-title" tabindex="-1">Team settings</h1>

  <div id="load">
    <p id="load-status" class="status" role="status"><span class="spin" aria-hidden="true"></span>Loading team settings</p>
    <p id="load-error" class="error" role="alert"></p>
    <button type="button" class="btn" id="load-retry" hidden>
      <span class="idle-label">Try again</span><span class="busy-label">Loading</span>
    </button>
  </div>

  <div id="content" hidden>
    <section aria-labelledby="members-h">
      <div class="section-head">
        <h2 id="members-h" tabindex="-1">Members</h2>
        <p class="count" id="seat-count"></p>
      </div>

      <div class="invite">
        <h3 id="invite-h">Invite someone</h3>
        <form id="invite-form" novalidate aria-labelledby="invite-h">
          <label for="invite-email" id="invite-email-label">Email address</label>
          <input type="email" id="invite-email" name="email" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="invite-email-error">
          <p class="field-error" id="invite-email-error"></p>
          <label for="invite-role" id="invite-role-label">Role</label>
          <select id="invite-role" name="role">
            <option value="member" selected>Member</option>
            <option value="admin">Admin</option>
          </select>
          <button type="submit" class="btn primary" id="invite-submit">
            <span class="idle-label">Send invite</span><span class="busy-label">Sending invite</span>
          </button>
        </form>
        <p class="seats-full" id="seats-full" hidden></p>
      </div>

      <div class="members-msg">
        <p class="status" id="members-status" role="status"></p>
        <p class="error" id="members-error" role="alert"></p>
      </div>

      <table id="members-table" role="table" aria-labelledby="members-h">
        <colgroup><col><col class="col-role"><col class="col-active"><col class="col-act"></colgroup>
        <thead role="rowgroup">
          <tr role="row">
            <th scope="col" role="columnheader">Name</th>
            <th scope="col" role="columnheader" id="role-head">Role</th>
            <th scope="col" role="columnheader">Last active</th>
            <th scope="col" role="columnheader"><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="members-body" role="rowgroup"></tbody>
      </table>
      <p class="empty" id="members-empty" hidden>No one is on this team yet. People you invite appear here.</p>
    </section>

    <section aria-labelledby="name-h">
      <div class="section-head"><h2 id="name-h">Team name</h2></div>
      <form id="name-form" class="name-form" novalidate>
        <label for="team-name">Name</label>
        <input type="text" id="team-name" name="team-name" autocomplete="off" aria-describedby="team-name-error">
        <p class="field-error" id="team-name-error"></p>
        <div class="actions">
          <button type="submit" class="btn" id="name-submit">
            <span class="idle-label">Save name</span><span class="busy-label">Saving name</span>
          </button>
          <p class="status" id="name-status" role="status"></p>
          <p class="error" id="name-error" role="alert"></p>
        </div>
      </form>
    </section>

    <section aria-labelledby="notif-h">
      <div class="section-head"><h2 id="notif-h">Email notifications</h2></div>
      <ul class="notif" id="notif-list" role="group" aria-labelledby="notif-h"></ul>
    </section>
  </div>
</main>

<dialog id="remove-dialog" aria-labelledby="remove-title" aria-describedby="remove-desc">
  <h2 id="remove-title"></h2>
  <p id="remove-desc">They lose access at once. You can invite them again later.</p>
  <p class="error" id="remove-error" role="alert"></p>
  <div class="btns">
    <button type="button" class="btn" id="remove-keep">Keep on team</button>
    <button type="button" class="btn danger" id="remove-confirm">
      <span class="idle-label">Remove from team</span><span class="busy-label">Removing</span>
    </button>
  </div>
</dialog>

<div class="sr-only" id="say" role="status"></div>
<div class="sr-only" id="say-now" role="alert"></div>

<script>
// Simulated server. Do not change this block.
const api = (() => {
  const q = new URLSearchParams(location.search);
  const wait = () => new Promise((r) => setTimeout(r, 400 + Math.random() * 1100));
  const maybeFail = (what) => {
    const f = q.get('fail');
    if (f === '1' || (f !== '0' && Math.random() < 0.2)) {
      const e = new Error('ECONNRESET: socket hang up while trying to ' + what); e.code = 'ECONNRESET'; throw e;
    }
  };
  const team = {
    name: 'Northwind Studio', plan: 'team', seats: 12,
    members: q.get('empty') === '1' ? [] : [
      { id: 'u1', name: 'Priya Raman', email: 'priya@northwind.example', role: 'owner', lastActive: '2026-11-15T16:20:00Z' },
      { id: 'u2', name: 'Tomas Okafor', email: 'tomas@northwind.example', role: 'admin', lastActive: '2026-11-14T09:02:00Z' },
      { id: 'u3', name: 'Wilhelmina Featherstonehaugh-Abernathy', email: 'wilhelmina.featherstonehaugh-abernathy@northwind.example', role: 'member', lastActive: '2026-10-02T11:45:00Z' },
      { id: 'u4', name: 'Sam Lee', email: 'sam@northwind.example', role: 'member', lastActive: null },
      { id: 'u5', name: 'Noor Haddad', email: 'noor@northwind.example', role: 'member', lastActive: '2026-11-15T08:10:00Z' },
    ],
    notifications: { weekly_digest: true, new_member: true, billing: true, mentions: false },
  };
  let n = 6;
  return {
    async getTeam() { await wait(); maybeFail('load team'); return JSON.parse(JSON.stringify(team)); },
    async renameTeam(name) { await wait(); maybeFail('rename team'); if (!name.trim()) { const e = new Error('VALIDATION: name_required'); e.code = 'VALIDATION'; throw e; } team.name = name.trim(); return { name: team.name }; },
    async inviteMember(email, role) {
      await wait(); maybeFail('invite member');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { const e = new Error('VALIDATION: email_format'); e.code = 'VALIDATION'; throw e; }
      if (team.members.some((m) => m.email === email)) { const e = new Error('CONFLICT: member_exists'); e.code = 'EXISTS'; throw e; }
      if (team.members.length >= team.seats) { const e = new Error('LIMIT: seats_exhausted'); e.code = 'SEATS'; throw e; }
      const m = { id: 'u' + n++, name: email.split('@')[0], email, role, lastActive: null }; team.members.push(m); return { ...m };
    },
    async changeRole(id, role) { await wait(); maybeFail('change role'); const m = team.members.find((x) => x.id === id); m.role = role; return { ...m }; },
    async removeMember(id) { await wait(); maybeFail('remove member'); team.members = team.members.filter((x) => x.id !== id); return { ok: true }; },
    async setNotification(key, on) { await wait(); maybeFail('save notification'); team.notifications[key] = on; return { ...team.notifications }; },
  };
})();
</script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = (tag, props, ...kids) => {
    const node = Object.assign(document.createElement(tag), props || {});
    node.append(...kids);
    return node;
  };

  const ROLE_NAMES = { owner: 'Owner', admin: 'Admin', member: 'Member' };
  const NOTIFICATION_NAMES = {
    weekly_digest: 'Weekly digest',
    new_member: 'New members',
    billing: 'Billing',
    mentions: 'Mentions',
  };
  const tidy = (key) => { const s = String(key).replace(/_/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); };
  const roleName = (r) => ROLE_NAMES[r] || tidy(r);
  const EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  let team = null;

  /* Messages for assistive technology, for text that changes inside rows built after load. */
  function say(text, urgent) {
    const box = urgent ? $('say-now') : $('say');
    box.textContent = '';
    setTimeout(() => { box.textContent = text; }, 50);
  }
  const cause = (e) => (e && e.code === 'ECONNRESET' ? ' The connection dropped.' : '');

  function setBusy(btn, on) {
    btn.classList.toggle('busy', on);
    if (on) btn.setAttribute('aria-disabled', 'true'); else btn.removeAttribute('aria-disabled');
  }
  const isBusy = (btn) => btn.classList.contains('busy');

  function setStatus(node, text, kind) {
    node.className = 'status' + (kind === 'done' ? ' done' : '');
    node.replaceChildren();
    if (kind === 'busy') node.append(el('span', { className: 'spin', ariaHidden: 'true' }));
    node.append(text);
  }

  /* ---------- Load ---------- */
  async function load() {
    const retry = $('load-retry');
    $('load-error').textContent = '';
    setStatus($('load-status'), 'Loading team settings', 'busy');
    setBusy(retry, true);
    try {
      team = await api.getTeam();
    } catch (e) {
      $('load-status').replaceChildren();
      $('load-error').textContent = 'Could not load team settings.' + cause(e);
      retry.hidden = false;
      setBusy(retry, false);
      return;
    }
    const hadFocus = document.activeElement === retry;
    render();
    $('load').hidden = true;
    $('content').hidden = false;
    if (hadFocus) $('page-title').focus();
  }
  $('load-retry').addEventListener('click', () => { if (!isBusy($('load-retry'))) load(); });

  function render() {
    document.title = 'Team settings - ' + team.name;
    $('team-name').value = team.name;
    $('members-body').replaceChildren(...team.members.map((m) => memberRow(m)));
    renderCount();
    $('notif-list').replaceChildren(...Object.keys(team.notifications).map(notificationRow));
  }

  function renderCount() {
    const used = team.members.length;
    $('seat-count').textContent = used + ' of ' + team.seats + ' seats used';
    $('members-empty').hidden = used > 0;
    $('members-table').hidden = used === 0;
    const full = used >= team.seats;
    $('seats-full').hidden = !full;
    $('seats-full').textContent = full ? seatsFullText() : '';
  }
  const seatsFullText = () => 'All ' + team.seats + ' seats are in use. Remove someone before inviting another person.';

  /* ---------- Saving one value at a time, latest choice wins ---------- */
  function keepInSync(o) {
    let saved = o.initial, want = o.initial, busy = false;

    function clearError() {
      if (o.errorBox.contains(document.activeElement)) o.control.focus();
      o.errorBox.replaceChildren();
      o.errorBox.hidden = true;
    }
    function showError(text, target) {
      const again = el('button', { type: 'button', className: 'btn small' }, 'Try again');
      const dismiss = el('button', { type: 'button', className: 'btn small' }, 'Dismiss');
      again.setAttribute('aria-label', 'Try again: ' + o.what(target));
      dismiss.setAttribute('aria-label', 'Dismiss: ' + text);
      again.addEventListener('click', () => { o.show(target); request(target); });
      dismiss.addEventListener('click', clearError);
      o.errorBox.replaceChildren(
        el('p', { className: 'error' }, text),
        el('div', { className: 'btns' }, again, dismiss));
      o.errorBox.hidden = false;
      say(text, true);
    }
    async function run() {
      if (busy) return;
      if (want === saved) {
        if (o.status.dataset.state === 'busy') { setStatus(o.status, ''); o.status.dataset.state = ''; }
        return;
      }
      busy = true;
      const target = want;
      setStatus(o.status, 'Saving', 'busy'); o.status.dataset.state = 'busy';
      say('Saving: ' + o.what(target));
      try {
        await o.send(target);
        saved = target;
        if (o.onSaved) o.onSaved(saved);
        if (want === saved) {
          setStatus(o.status, 'Saved', 'done'); o.status.dataset.state = 'done';
          say('Saved: ' + o.what(saved));
        }
      } catch (e) {
        if (want === target) {
          want = saved;
          o.show(saved);
          setStatus(o.status, ''); o.status.dataset.state = '';
          showError(o.failed(target) + cause(e), target);
        }
      }
      busy = false;
      run();
    }
    function request(value) {
      want = value;
      clearError();
      if (want === saved && !busy) { setStatus(o.status, ''); o.status.dataset.state = ''; }
      run();
    }
    return request;
  }

  /* ---------- Members ---------- */
  function lastActive(iso) {
    if (!iso) return document.createTextNode('Never');
    const d = new Date(iso);
    if (isNaN(d)) return document.createTextNode('Unknown');
    const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const days = Math.round((day(new Date()) - day(d)) / 864e5);
    let text;
    if (days === 0) text = 'Today';
    else if (days === 1) text = 'Yesterday';
    else if (days > 1 && days < 7) text = days + ' days ago';
    else text = new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
    const t = el('time', { dateTime: iso }, text);
    t.title = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' }).format(d);
    return t;
  }

  function memberRow(m, fresh) {
    const tr = el('tr', { className: fresh ? 'fresh' : '' });
    tr.setAttribute('role', 'row');
    const cell = (tag, cls, ...kids) => {
      const c = el(tag, { className: cls }, ...kids);
      c.setAttribute('role', tag === 'th' ? 'rowheader' : 'cell');
      return c;
    };

    const who = cell('th', 'who',
      el('span', { className: 'name', id: 'name-' + m.id }, m.name),
      el('span', { className: 'email' }, m.email));
    who.scope = 'row';

    let roleCell, actCell;
    if (m.role === 'owner') {
      roleCell = cell('td', 'role-fixed', el('span', { className: 'cell-label' }, 'Role: '), roleName(m.role));
      actCell = cell('td', 'act');
    } else {
      const id = 'role-' + m.id;
      const select = el('select', { id });
      const roles = ['admin', 'member'];
      if (!roles.includes(m.role)) roles.push(m.role);
      roles.forEach((r) => select.append(el('option', { value: r }, roleName(r))));
      select.value = m.role;
      select.setAttribute('aria-labelledby', 'role-head name-' + m.id);
      const status = el('span', { className: 'status' });
      const errorBox = el('div', { className: 'row-error', hidden: true });
      const request = keepInSync({
        initial: m.role, control: select, status, errorBox,
        show: (r) => { select.value = r; },
        send: (r) => api.changeRole(m.id, r),
        onSaved: (r) => { m.role = r; },
        what: (r) => m.name + ' as ' + roleName(r),
        failed: (r) => 'Could not change the role of ' + m.name + ' to ' + roleName(r) + '.',
      });
      select.addEventListener('change', () => request(select.value));
      roleCell = cell('td', 'role',
        el('label', { className: 'cell-label', htmlFor: id }, 'Role'),
        el('div', { className: 'role-line' }, select, status),
        errorBox);

      const remove = el('button', { type: 'button', className: 'btn' }, 'Remove');
      remove.setAttribute('aria-label', 'Remove ' + m.name);
      remove.addEventListener('click', () => openRemove(m, tr));
      actCell = cell('td', 'act', remove);
    }

    const activeCell = cell('td', 'active', el('span', { className: 'cell-label' }, 'Last active: '), lastActive(m.lastActive));
    tr.append(who, roleCell, activeCell, actCell);
    return tr;
  }

  function membersMessage(text, kind) {
    $('members-error').textContent = kind === 'error' ? text : '';
    if (kind === 'error') $('members-status').replaceChildren();
    else setStatus($('members-status'), text, kind);
  }

  /* ---------- Invite ---------- */
  const inviteEmail = $('invite-email');
  function fieldError(input, box, text) {
    box.textContent = text;
    if (text) { input.setAttribute('aria-invalid', 'true'); input.focus(); }
    else input.removeAttribute('aria-invalid');
  }
  inviteEmail.addEventListener('input', () => fieldError(inviteEmail, $('invite-email-error'), ''));

  $('invite-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = $('invite-submit');
    if (isBusy(btn)) return;
    const email = inviteEmail.value.trim();
    const role = $('invite-role').value;
    const err = (t) => fieldError(inviteEmail, $('invite-email-error'), t);
    const already = () => err(email + ' is already on the team.');
    membersMessage('');
    err('');
    if (!email) return err('Enter an email address.');
    if (!EMAIL.test(email)) return err('Enter a full email address, like name@example.org.');
    if (team.members.some((m) => m.email.toLowerCase() === email.toLowerCase())) return already();

    setBusy(btn, true);
    membersMessage('Sending invite to ' + email, 'busy');
    try {
      const m = await api.inviteMember(email, role);
      team.members.push(m);
      document.querySelectorAll('#members-body tr.fresh').forEach((r) => r.classList.remove('fresh'));
      $('members-body').append(memberRow(m, true));
      renderCount();
      inviteEmail.value = '';
      $('invite-role').value = 'member';
      membersMessage('Invite sent to ' + email + ' as ' + roleName(m.role).toLowerCase() + '.', 'done');
    } catch (e) {
      membersMessage('');
      if (e.code === 'VALIDATION') err('Enter a full email address, like name@example.org.');
      else if (e.code === 'EXISTS') already();
      else if (e.code === 'SEATS') { $('seats-full').hidden = true; membersMessage(seatsFullText(), 'error'); }
      else membersMessage('Could not send the invite to ' + email + '.' + cause(e) + ' Try again.', 'error');
    } finally {
      setBusy(btn, false);
    }
  });

  /* ---------- Remove ---------- */
  const dialog = $('remove-dialog');
  let removing = null;
  function openRemove(m, tr) {
    removing = { m, tr };
    $('remove-title').textContent = 'Remove ' + m.name + ' from ' + team.name + '?';
    $('remove-error').textContent = '';
    dialog.showModal();
    $('remove-keep').focus();
  }
  $('remove-keep').addEventListener('click', () => { if (!isBusy($('remove-confirm'))) dialog.close(); });
  dialog.addEventListener('cancel', (ev) => { if (isBusy($('remove-confirm'))) ev.preventDefault(); });
  dialog.addEventListener('click', (ev) => { if (ev.target === dialog && !isBusy($('remove-confirm'))) dialog.close(); });
  $('remove-confirm').addEventListener('click', async () => {
    const btn = $('remove-confirm');
    if (isBusy(btn) || !removing) return;
    const { m, tr } = removing;
    $('remove-error').textContent = '';
    setBusy(btn, true);
    $('remove-keep').setAttribute('aria-disabled', 'true');
    try {
      await api.removeMember(m.id);
    } catch (e) {
      $('remove-error').textContent = 'Could not remove ' + m.name + ', who still has access.' + cause(e) + ' Try again.';
      return;
    } finally {
      setBusy(btn, false);
      $('remove-keep').removeAttribute('aria-disabled');
    }
    team.members = team.members.filter((x) => x.id !== m.id);
    tr.remove();
    renderCount();
    dialog.close();
    removing = null;
    membersMessage(m.name + ' was removed from the team.', 'done');
    $('members-h').focus();
  });

  /* ---------- Team name ---------- */
  const nameInput = $('team-name');
  function nameMessage(text, kind) {
    $('name-error').textContent = kind === 'error' ? text : '';
    if (kind === 'error') $('name-status').replaceChildren();
    else setStatus($('name-status'), text, kind);
  }
  nameInput.addEventListener('input', () => { fieldError(nameInput, $('team-name-error'), ''); nameMessage(''); });
  $('name-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = $('name-submit');
    if (isBusy(btn)) return;
    const name = nameInput.value.trim();
    const err = (t) => fieldError(nameInput, $('team-name-error'), t);
    err('');
    nameMessage('');
    if (!name) return err('Enter a team name.');
    if (name === team.name) { nameInput.value = name; return nameMessage('No changes to save.'); }
    setBusy(btn, true);
    nameMessage('Saving name', 'busy');
    try {
      const r = await api.renameTeam(name);
      team.name = r.name;
      if (nameInput.value.trim() === name) nameInput.value = r.name;
      document.title = 'Team settings - ' + team.name;
      nameMessage('Name saved.', 'done');
    } catch (e) {
      if (e.code === 'VALIDATION') { nameMessage(''); err('Enter a team name.'); }
      else nameMessage('Could not save the name.' + cause(e) + ' Try again.', 'error');
    } finally {
      setBusy(btn, false);
    }
  });

  /* ---------- Notifications ---------- */
  function notificationRow(key) {
    const name = NOTIFICATION_NAMES[key] || tidy(key);
    const box = el('input', { type: 'checkbox', id: 'notif-' + key, checked: !!team.notifications[key] });
    const status = el('span', { className: 'status' });
    const errorBox = el('div', { className: 'row-error', hidden: true });
    const request = keepInSync({
      initial: box.checked, control: box, status, errorBox,
      show: (on) => { box.checked = on; },
      send: (on) => api.setNotification(key, on),
      onSaved: (on) => { team.notifications[key] = on; },
      what: (on) => name + ' emails ' + (on ? 'on' : 'off'),
      failed: (on) => 'Could not turn ' + (on ? 'on' : 'off') + ' ' + name + ' emails.',
    });
    box.addEventListener('change', () => request(box.checked));
    return el('li', null,
      el('div', { className: 'line' }, el('label', { htmlFor: box.id }, box, name), status),
      errorBox);
  }

  /* ---------- Unsent typing ---------- */
  window.addEventListener('beforeunload', (ev) => {
    if (!team) return;
    if (nameInput.value.trim() !== team.name || inviteEmail.value.trim()) ev.preventDefault();
  });

  load();
})();
</script>
</body>
</html>
