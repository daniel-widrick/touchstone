<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices - Northwind</title>
<style>
:root {
  color-scheme: light dark;
  --surface:        #f4f7fb;
  --surface-raised: #fcfdff;
  --text:           #161b24;
  --text-muted:     #525864;
  --border:         #d4d8de;
  --border-strong:  #747b87;
  --accent:         #2750a2;
  --accent-soft:    #dde8fd;
  --danger:         #b02a2d;
  --backdrop:       rgb(22 27 36 / 0.45);

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.25rem; --text-xl: 1.5rem;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --control: 32px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface:        #0d0f15;
    --surface-raised: #15181f;
    --text:           #e5e8ed;
    --text-muted:     #9fa5ae;
    --border:         #2b2e34;
    --border-strong:  #6e7581;
    --accent:         #94b8f8;
    --accent-soft:    #1b2942;
    --danger:         #f7857d;
    --backdrop:       rgb(0 0 0 / 0.6);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: 48px; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--text);
  font: 400 var(--text-base)/1.5 var(--font);
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.nowrap { white-space: nowrap; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

.top, main { max-width: 1200px; margin: 0 auto; padding: 0 var(--s5); }
.top { padding-top: var(--s4); }
.brand { margin: 0; font-size: var(--text-sm); color: var(--text-muted); }
main { padding-bottom: var(--s6); }
h1 { margin: 0 0 var(--s4); font-size: var(--text-xl); line-height: 1.25; font-weight: 600; }

/* Search and status filter */
.find { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s4) var(--s5); margin-bottom: var(--s4); }
.field { flex: 0 1 360px; min-width: 0; }
.field label, .group-label {
  display: block; margin: 0 0 var(--s1);
  font-size: var(--text-sm); line-height: 1.45; font-weight: 600;
}
.field input {
  display: block; width: 100%; height: 40px; padding: 0 var(--s3);
  font: inherit; color: var(--text);
  background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 6px;
}
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* Buttons */
button {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--control); padding: 0 var(--s3);
  font: 400 var(--text-sm)/1.45 var(--font); white-space: nowrap;
  color: var(--text); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 6px;
  cursor: pointer;
}
button:hover { border-color: var(--text); }
button:active { background: var(--accent-soft); }
button.danger { color: var(--danger); }
button.danger:hover { border-color: var(--danger); }
button[aria-disabled="true"] { color: var(--text-muted); border-color: var(--border); cursor: default; }
button[aria-disabled="true"]:active { background: var(--surface-raised); }
.chip { min-height: 40px; }
.chip .n { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip[aria-pressed="true"] .n { color: var(--accent); }

.spin::before, .busy::before {
  content: ""; flex: none; display: inline-block; width: 12px; height: 12px;
  border: 2px solid var(--border-strong); border-top-color: transparent; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spin::before, .busy::before { animation: none; border-top-color: var(--border-strong); border-style: dotted; }
}

/* Result line */
.summary { display: flex; flex-wrap: wrap; align-items: center; row-gap: var(--s2); min-height: 40px; margin-bottom: var(--s2); }
.summary > * { margin: 0 var(--s4) 0 0; }
.summary p { font-size: var(--text-sm); line-height: 1.45; }
.summary p:empty { margin: 0; }
#count { font-weight: 600; }
#loading { display: flex; align-items: center; gap: var(--s2); color: var(--text-muted); }
#fail-text { color: var(--danger); }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); line-height: 1.45; }
thead th {
  position: sticky; top: 0; z-index: 1;
  padding: var(--s2) var(--s3);
  text-align: left; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted);
  background: var(--surface);
  box-shadow: inset 0 -1px 0 var(--border-strong);
}
tbody tr { height: 48px; border-bottom: 1px solid var(--border); }
tbody th, tbody td { padding: var(--s1) var(--s3); text-align: left; vertical-align: middle; font-weight: 400; }
tbody th { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.c-amt, thead .c-amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.c-due { white-space: nowrap; font-variant-numeric: tabular-nums; }
.c-cust { overflow-wrap: anywhere; }
.c-act { width: 1%; }
.st, .rem { display: block; }
.st.overdue { color: var(--danger); font-weight: 600; }
.st.overdue svg { width: 14px; height: 14px; margin-right: var(--s1); vertical-align: -2px; }
.st.quiet, .rem { color: var(--text-muted); }
.rem { font-size: var(--text-xs); line-height: 1.4; }
.act { display: flex; align-items: center; white-space: nowrap; }
.btns { display: flex; gap: var(--s2); }
.note { display: inline-flex; align-items: center; gap: var(--s2); color: var(--text-muted); }
.note:not(:empty) { margin-right: var(--s2); }
.err { margin: 0; font-size: var(--text-xs); line-height: 1.4; color: var(--danger); }
.err:not(:empty) { margin-top: var(--s1); }

.pager { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s4); }
.pager p { margin: 0; font-size: var(--text-sm); line-height: 1.45; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* Delete confirmation */
dialog {
  width: calc(100% - var(--s6)); max-width: 440px; padding: var(--s5);
  color: var(--text); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 8px;
}
dialog::backdrop { background: var(--backdrop); }
dialog h2 { margin: 0 0 var(--s2); font-size: var(--text-lg); line-height: 1.3; font-weight: 600; overflow-wrap: anywhere; }
dialog p { margin: 0; overflow-wrap: anywhere; }
#del-error { color: var(--danger); font-size: var(--text-sm); line-height: 1.45; }
#del-error:not(:empty) { margin-top: var(--s3); }
.dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--s2); margin-top: var(--s5); }
.dialog-actions button { min-height: 40px; padding: 0 var(--s4); }
#del-keep { border-color: var(--text); font-weight: 600; }

/* Narrow screens: each invoice becomes a block, in the same order */
@media (max-width: 900px) {
  :root { --control: 44px; }
  .top, main { padding-left: var(--s4); padding-right: var(--s4); }
  .field { flex-basis: 100%; }
  .field input { height: 44px; }
  .chip { min-height: 44px; }
  .dialog-actions button { min-height: 44px; }
  table, tbody, tbody th, tbody td { display: block; }
  thead {
    position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%);
  }
  tbody { border-top: 1px solid var(--border-strong); }
  tbody tr {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1) var(--s3);
    height: auto; padding: var(--s3) 0;
  }
  tbody th, tbody td { padding: 0; }
  .c-num { grid-area: 1 / 1; font-size: var(--text-base); }
  .c-amt { grid-area: 1 / 2; font-size: var(--text-base); }
  .c-cust, .c-act { grid-column: 1 / -1; }
  .c-status { grid-area: 3 / 1; }
  .c-due { grid-area: 3 / 2; text-align: right; }
  .c-due::before { content: "Due "; color: var(--text-muted); }
  .c-act { width: auto; }
  .act { flex-wrap: wrap; row-gap: var(--s2); }
  .act:has(.note:not(:empty)), .act:has(.btns:not(:empty)) { margin-top: var(--s2); }
}
</style>
</head>
<body>
<header class="top">
  <p class="brand">Northwind</p>
</header>

<main>
  <h1>Invoices</h1>

  <div class="find">
    <div class="field" role="search">
      <label for="q">Find by customer or invoice number</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search">
    </div>
    <div role="group" aria-labelledby="status-label">
      <p class="group-label" id="status-label">Status</p>
      <div class="chips" id="chips">
        <button type="button" class="chip" data-status="" aria-pressed="true">All <span class="n"></span></button>
        <button type="button" class="chip" data-status="overdue" aria-pressed="false">Overdue <span class="n"></span></button>
        <button type="button" class="chip" data-status="sent" aria-pressed="false">Sent <span class="n"></span></button>
        <button type="button" class="chip" data-status="draft" aria-pressed="false">Draft <span class="n"></span></button>
        <button type="button" class="chip" data-status="paid" aria-pressed="false">Paid <span class="n"></span></button>
      </div>
    </div>
  </div>

  <div class="summary">
    <p id="loading" role="status" class="spin">Loading invoices...</p>
    <p id="fail-text" role="alert"></p>
    <button type="button" id="retry" hidden>Try again</button>
    <p id="count" role="status" tabindex="-1"></p>
    <button type="button" id="clear" hidden>Clear search</button>
    <button type="button" id="recheck" hidden>Check again</button>
    <p id="notice" role="status"></p>
  </div>

  <table id="table" role="table" aria-label="Invoices" hidden>
    <thead role="rowgroup">
      <tr role="row">
        <th role="columnheader" scope="col">Invoice</th>
        <th role="columnheader" scope="col">Customer</th>
        <th role="columnheader" scope="col">Due</th>
        <th role="columnheader" scope="col">Status</th>
        <th role="columnheader" scope="col" class="c-amt">Amount</th>
        <th role="columnheader" scope="col">Actions</th>
      </tr>
    </thead>
    <tbody id="rows" role="rowgroup"></tbody>
  </table>

  <nav class="pager" id="pager" aria-label="Pages" hidden>
    <button type="button" id="prev">Previous page</button>
    <p id="page-text"></p>
    <button type="button" id="next">Next page</button>
  </nav>
</main>

<dialog id="del" aria-labelledby="del-title" aria-describedby="del-body">
  <h2 id="del-title"></h2>
  <p id="del-body"></p>
  <p id="del-error" role="alert"></p>
  <div class="dialog-actions">
    <button type="button" id="del-keep">Keep draft</button>
    <button type="button" id="del-confirm" class="danger">Delete draft</button>
  </div>
</dialog>

<script>
// Simulated server. Do not change this block.
const api = (() => {
  const q = new URLSearchParams(location.search);
  const wait = () => new Promise((r) => setTimeout(r, 400 + Math.random() * 1100));
  const maybeFail = (what) => {
    const f = q.get('fail');
    if (f === '1' || (f !== '0' && Math.random() < 0.2)) {
      const e = new Error('ECONNRESET: socket hang up while trying to ' + what); e.code = 'ECONNRESET'; throw e;
    }
  };
  const customers = ['Acme Ltd', 'Brightside Bakery', 'Castellan Freight and Logistics International', 'Dovetail Joinery', 'Eastfield Primary School', 'Fennel & Rye', 'Greyfriars Dental', 'Harbour Lights Hotel', 'Ivy Lane Books', 'Juniper Health'];
  const statuses = ['draft', 'sent', 'sent', 'paid', 'paid', 'paid', 'overdue', 'overdue'];
  let invoices = q.get('empty') === '1' ? [] : Array.from({ length: 46 }, (_, i) => ({
    id: 'inv_' + (9000 + i), number: 'NW-' + (2041 + i), customer: customers[i % customers.length],
    issued: new Date(2026, 8, 1 + i).toISOString(), due: new Date(2026, 9, 1 + i).toISOString(),
    amount: Math.round((120 + ((i * 7919) % 48000)) * 100) / 100 + (i % 9 === 0 ? 1250000 : 0), currency: 'GBP',
    status: statuses[i % statuses.length], reminderSentAt: null,
  }));
  return {
    async listInvoices() { await wait(); maybeFail('list invoices'); return invoices.map((x) => ({ ...x })); },
    async markPaid(id) { await wait(); maybeFail('mark paid'); const x = invoices.find((v) => v.id === id); x.status = 'paid'; return { ...x }; },
    async sendReminder(id) { await wait(); maybeFail('send reminder'); const x = invoices.find((v) => v.id === id); x.reminderSentAt = new Date().toISOString(); return { ...x }; },
    async deleteInvoice(id) { await wait(); maybeFail('delete invoice'); invoices = invoices.filter((v) => v.id !== id); return { ok: true }; },
  };
})();
</script>

<script>
(() => {
  const PAGE_SIZE = 25;
  const UNDO_MS = 6000;
  const STATUSES = ['overdue', 'sent', 'draft', 'paid'];
  const $ = (id) => document.getElementById(id);
  const el = {
    q: $('q'), chips: $('chips'), loading: $('loading'), failText: $('fail-text'), retry: $('retry'),
    count: $('count'), clear: $('clear'), recheck: $('recheck'), notice: $('notice'),
    table: $('table'), rows: $('rows'), pager: $('pager'), prev: $('prev'), next: $('next'), pageText: $('page-text'),
    del: $('del'), delTitle: $('del-title'), delBody: $('del-body'), delError: $('del-error'),
    delKeep: $('del-keep'), delConfirm: $('del-confirm'),
  };

  const params = new URLSearchParams(location.search);
  const state = {
    phase: 'loading',            // loading | failed | ready
    invoices: [],
    q: params.get('q') || '',
    status: STATUSES.includes(params.get('status')) ? params.get('status') : '',
    page: Math.max(1, parseInt(params.get('page'), 10) || 1),
    ops: new Map(),              // invoice id -> { kind: 'paid' | 'remind', phase: 'hold' | 'busy', at, timer }
    errs: new Map(),             // invoice id -> message shown in its row
    notice: '',
    deleting: null,              // { id, busy }
  };
  const trs = new Map();         // invoice id -> its table row

  /* Formatting */
  const moneyFormats = {};
  const money = (amount, currency) => {
    moneyFormats[currency] = moneyFormats[currency] || new Intl.NumberFormat('en-GB', { style: 'currency', currency });
    return moneyFormats[currency].format(amount);
  };
  const dateFormat = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const shortDateFormat = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });
  const timeFormat = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' });
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const daysSince = (iso) => Math.round((startOfDay(new Date()) - startOfDay(new Date(iso))) / 86400000);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const OVERDUE_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5v4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.3" r="0.95" fill="currentColor"/></svg>';

  function statusHtml(inv) {
    if (inv.status === 'overdue') {
      const days = daysSince(inv.due);
      const by = days > 0 ? ' by ' + days + (days === 1 ? ' day' : ' days') : '';
      return '<span class="st overdue">' + OVERDUE_ICON + 'Overdue' + by + '</span>';
    }
    if (inv.status === 'sent') return '<span class="st">Sent</span>';
    if (inv.status === 'paid') return '<span class="st quiet">Paid</span>';
    return '<span class="st quiet">Draft</span>';
  }
  function reminderText(inv) {
    if (!inv.reminderSentAt) return '';
    const d = new Date(inv.reminderSentAt);
    const day = daysSince(inv.reminderSentAt) === 0 ? 'today' : shortDateFormat.format(d);
    return 'Reminder sent ' + day + ', ' + timeFormat.format(d);
  }

  /* Search and filter */
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
  function matches(inv) {
    if (state.status && inv.status !== state.status) return false;
    const q = norm(state.q);
    if (!q) return true;
    return norm(inv.customer).includes(q) || norm(inv.number).includes(q) || norm(inv.number).replace('-', '').includes(q.replace(/[\s-]/g, ''));
  }
  function syncUrl() {
    const p = new URLSearchParams(location.search);
    const set = (k, v) => (v ? p.set(k, v) : p.delete(k));
    set('q', state.q.trim());
    set('status', state.status);
    set('page', state.page > 1 ? String(state.page) : '');
    const s = p.toString();
    const url = location.pathname + (s ? '?' + s : '') + location.hash;
    if (url !== location.pathname + location.search + location.hash) {
      try { history.replaceState(null, '', url); } catch (e) { /* file pages in some browsers refuse; the view still works */ }
    }
  }

  /* Rows */
  function buttonsFor(inv, op) {
    if (op) return op.phase === 'hold' ? [['undo', 'Undo', '']] : [];
    if (inv.status === 'overdue') return [['paid', 'Mark paid', ''], ['remind', 'Send reminder', '']];
    if (inv.status === 'sent') return [['paid', 'Mark paid', '']];
    if (inv.status === 'draft') return [['delete', 'Delete draft', 'danger']];
    return [];
  }
  function createRow(inv) {
    const tr = document.createElement('tr');
    tr.setAttribute('role', 'row');
    tr.dataset.id = inv.id;
    tr.innerHTML =
      '<th role="rowheader" scope="row" class="c-num" tabindex="-1" id="n-' + esc(inv.id) + '"></th>' +
      '<td role="cell" class="c-cust"></td>' +
      '<td role="cell" class="c-due"></td>' +
      '<td role="cell" class="c-status"><span class="st-slot"></span><span class="rem"></span></td>' +
      '<td role="cell" class="c-amt"></td>' +
      '<td role="cell" class="c-act"><div class="act"><span class="note" role="status"></span><span class="btns"></span></div><p class="err" role="alert"></p></td>';
    tr._cache = {};
    return tr;
  }
  function setIfChanged(tr, key, value, apply) {
    if (tr._cache[key] === value) return false;
    tr._cache[key] = value;
    apply(value);
    return true;
  }
  function updateRow(tr, inv) {
    const op = state.ops.get(inv.id);
    const q = (sel) => tr.querySelector(sel);
    setIfChanged(tr, 'num', inv.number, (v) => { q('.c-num').textContent = v; });
    setIfChanged(tr, 'cust', inv.customer, (v) => { q('.c-cust').textContent = v; });
    setIfChanged(tr, 'due', inv.due, (v) => {
      q('.c-due').innerHTML = '<time datetime="' + esc(v.slice(0, 10)) + '">' + esc(dateFormat.format(new Date(v))) + '</time>';
    });
    setIfChanged(tr, 'status', statusHtml(inv), (v) => { q('.st-slot').innerHTML = v; });
    setIfChanged(tr, 'rem', reminderText(inv), (v) => { q('.rem').textContent = v; });
    setIfChanged(tr, 'amt', money(inv.amount, inv.currency), (v) => { q('.c-amt').textContent = v; });

    const note = !op ? '' : op.kind === 'paid' ? 'Marking as paid...' : 'Sending reminder...';
    setIfChanged(tr, 'note', note, (v) => { q('.note').textContent = v; });
    q('.note').classList.toggle('busy', !!op && op.phase === 'busy');

    const buttons = buttonsFor(inv, op);
    const btns = q('.btns');
    const focused = btns.contains(document.activeElement) ? document.activeElement.dataset.act : null;
    if (op) tr._lastKind = op.kind;
    setIfChanged(tr, 'btns', JSON.stringify(buttons), () => {
      btns.innerHTML = buttons.map(([act, label, cls]) =>
        '<button type="button" data-act="' + act + '"' + (cls ? ' class="' + cls + '"' : '') +
        ' aria-describedby="n-' + esc(inv.id) + '">' + label + '</button>').join('');
      if (focused) {
        const target = btns.querySelector('[data-act="' + focused + '"]') ||
          btns.querySelector('[data-act="undo"]') ||
          (tr._lastKind && btns.querySelector('[data-act="' + tr._lastKind + '"]')) ||
          btns.querySelector('button') || q('.c-num');
        target.focus();
      }
    });
    setIfChanged(tr, 'err', state.errs.get(inv.id) || '', (v) => { q('.err').textContent = v; });
  }
  function reconcileRows(pageItems) {
    const keep = new Set(pageItems.map((x) => x.id));
    for (const [id, tr] of trs) {
      if (keep.has(id)) continue;
      if (tr.contains(document.activeElement)) {
        const near = tr.nextElementSibling || tr.previousElementSibling;
        (near ? near.querySelector('.c-num') : el.count).focus();
      }
      tr.remove();
      trs.delete(id);
    }
    pageItems.forEach((inv, i) => {
      let tr = trs.get(inv.id);
      if (!tr) { tr = createRow(inv); trs.set(inv.id, tr); }
      if (el.rows.children[i] !== tr) el.rows.insertBefore(tr, el.rows.children[i] || null);
      updateRow(tr, inv);
    });
  }

  /* The whole view */
  function setText(node, text) { if (node.textContent !== text) node.textContent = text; }
  function render() {
    syncUrl();
    const ready = state.phase === 'ready';
    const counts = { '': state.invoices.length };
    STATUSES.forEach((s) => { counts[s] = 0; });
    state.invoices.forEach((x) => { counts[x.status] = (counts[x.status] || 0) + 1; });
    el.chips.querySelectorAll('.chip').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.status === state.status));
      setText(b.querySelector('.n'), ready ? String(counts[b.dataset.status]) : '');
    });

    setText(el.loading, state.phase === 'loading' && !state.reloading ? 'Loading invoices...' : '');
    el.loading.classList.toggle('spin', el.loading.textContent !== '');
    setText(el.failText, state.phase === 'failed' ? 'Invoices could not be loaded. Check your connection, then try again.' : '');
    const failedOrRetrying = state.phase === 'failed' || (state.reloading === 'retry' && state.phase === 'loading');
    el.retry.hidden = !failedOrRetrying;
    setBusy(el.retry, state.phase === 'loading', 'Try again', 'Trying again...');

    if (!ready) {
      const rechecking = state.reloading === 'recheck';
      el.table.hidden = true; el.pager.hidden = true; el.clear.hidden = true;
      el.recheck.hidden = !rechecking;
      setBusy(el.recheck, rechecking, 'Check again', 'Checking...');
      setText(el.count, rechecking ? 'No invoices yet. They appear here once they are created.' : '');
      setText(el.notice, '');
      return;
    }

    const list = state.invoices.filter(matches);
    const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    state.page = Math.min(Math.max(1, state.page), pages);
    const start = (state.page - 1) * PAGE_SIZE;
    const pageItems = list.slice(start, start + PAGE_SIZE);
    const q = state.q.trim();
    const filtered = !!(q || state.status);
    const noun = (state.status ? state.status + ' ' : '') + (list.length === 1 ? 'invoice' : 'invoices');
    const tail = q ? ' matching "' + q + '"' : '';

    let countText;
    if (state.invoices.length === 0) countText = 'No invoices yet. They appear here once they are created.';
    else if (list.length === 0) countText = 'No ' + (state.status ? state.status + ' ' : '') + 'invoices' + (q ? ' match "' + q + '"' : '') + '.';
    else if (pages > 1) countText = 'Showing ' + (start + 1) + ' to ' + (start + pageItems.length) + ' of ' + list.length + ' ' + noun + tail;
    else countText = list.length + ' ' + noun + tail;
    setText(el.count, countText);

    el.recheck.hidden = state.invoices.length !== 0;
    setBusy(el.recheck, false, 'Check again', 'Checking...');
    el.clear.hidden = !filtered || state.invoices.length === 0;
    setText(el.clear, q && state.status ? 'Clear search and filter' : q ? 'Clear search' : 'Show all invoices');
    setText(el.notice, state.notice);

    reconcileRows(pageItems);
    el.table.hidden = list.length === 0;

    el.pager.hidden = pages < 2;
    if (pages > 1) {
      const wasPrev = document.activeElement === el.prev, wasNext = document.activeElement === el.next;
      el.prev.hidden = state.page === 1;
      el.next.hidden = state.page === pages;
      if (wasPrev && el.prev.hidden) el.next.focus();
      if (wasNext && el.next.hidden) el.prev.focus();
      setText(el.pageText, 'Page ' + state.page + ' of ' + pages);
    }
  }
  function setBusy(button, busy, label, busyLabel) {
    setText(button, busy ? busyLabel : label);
    button.classList.toggle('busy', busy);
    if (busy) button.setAttribute('aria-disabled', 'true'); else button.removeAttribute('aria-disabled');
  }

  /* Loading */
  async function load(how) {
    state.phase = 'loading';
    state.reloading = how || '';
    render();
    try {
      state.invoices = await api.listInvoices();
      state.phase = 'ready';
    } catch (e) {
      state.phase = 'failed';
    }
    const focusWasOnRetry = document.activeElement === el.retry;
    const focusWasOnRecheck = document.activeElement === el.recheck;
    state.reloading = '';
    render();
    if (state.phase === 'ready' && focusWasOnRetry) (state.invoices.length ? el.q : el.recheck).focus();
    if (state.phase === 'failed' && focusWasOnRecheck) el.retry.focus();
    if (state.phase === 'ready' && focusWasOnRecheck && state.invoices.length) el.q.focus();
  }

  /* Mark paid and send reminder: held for a few seconds so a slip can be undone, then sent */
  const invoiceById = (id) => state.invoices.find((x) => x.id === id);
  function startOp(id, kind) {
    if (state.ops.has(id)) return;
    state.errs.delete(id);
    state.notice = '';
    const op = { kind, phase: 'hold', at: performance.now() };
    op.timer = setTimeout(() => commit(id), UNDO_MS);
    state.ops.set(id, op);
    render();
  }
  function undo(id) {
    const op = state.ops.get(id);
    if (!op || op.phase !== 'hold') return;
    if (performance.now() - op.at < 400) return; // a double click on the action must not undo it
    clearTimeout(op.timer);
    state.ops.delete(id);
    render();
  }
  async function commit(id) {
    const op = state.ops.get(id);
    if (!op || op.phase !== 'hold') return;
    clearTimeout(op.timer);
    op.phase = 'busy';
    render();
    const number = (invoiceById(id) || {}).number || 'The invoice';
    try {
      const updated = await (op.kind === 'paid' ? api.markPaid(id) : api.sendReminder(id));
      const i = state.invoices.findIndex((x) => x.id === id);
      if (i >= 0) state.invoices[i] = updated;
      state.ops.delete(id);
      if (!trs.has(id) || !matches(updated)) {
        state.notice = op.kind === 'paid' ? number + ' marked as paid.' : 'Reminder sent for ' + number + '.';
      }
    } catch (e) {
      state.ops.delete(id);
      const message = op.kind === 'paid'
        ? number + ' was not marked as paid. Try again.'
        : 'The reminder for ' + number + ' was not sent. Try again.';
      state.errs.set(id, message);
      if (!trs.has(id)) state.notice = message;
    }
    render();
  }

  /* Delete a draft: permanent, so it asks first */
  function openDelete(id) {
    const inv = invoiceById(id);
    if (!inv) return;
    state.deleting = { id, busy: false };
    state.notice = '';
    setText(el.notice, '');
    el.delTitle.innerHTML = 'Permanently delete draft <span class="nowrap">' + esc(inv.number) + '?</span>';
    el.delBody.textContent = inv.customer + ', ' + money(inv.amount, inv.currency) + '. A deleted draft cannot be restored.';
    el.delError.textContent = '';
    setDeleteBusy(false);
    el.del.showModal();
    el.delKeep.focus();
  }
  function setDeleteBusy(busy) {
    if (state.deleting) state.deleting.busy = busy;
    setBusy(el.delConfirm, busy, 'Delete draft', 'Deleting...');
    if (busy) el.delKeep.setAttribute('aria-disabled', 'true'); else el.delKeep.removeAttribute('aria-disabled');
  }
  async function confirmDelete() {
    const d = state.deleting;
    if (!d || d.busy) return;
    const inv = invoiceById(d.id);
    el.delError.textContent = '';
    setDeleteBusy(true);
    try {
      await api.deleteInvoice(d.id);
    } catch (e) {
      setDeleteBusy(false);
      el.delError.textContent = inv.number + ' was not deleted. Try again, or keep the draft.';
      el.delConfirm.focus();
      return;
    }
    state.invoices = state.invoices.filter((x) => x.id !== d.id);
    state.errs.delete(d.id);
    state.deleting = null;
    const tr = trs.get(d.id);
    const near = tr && (tr.nextElementSibling || tr.previousElementSibling);
    el.del.close();
    state.notice = 'Draft ' + inv.number + ' deleted.';
    if (near) near.querySelector('.c-num').focus(); else el.count.focus();
    render();
  }
  function closeDelete() {
    if (state.deleting && state.deleting.busy) return;
    state.deleting = null;
    if (el.del.open) el.del.close();
  }

  /* Events */
  function changeView(change) {
    change();
    state.notice = '';
    render();
  }
  el.q.value = state.q;
  el.q.addEventListener('input', () => changeView(() => { state.q = el.q.value; state.page = 1; }));
  el.chips.addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (b) changeView(() => { state.status = b.dataset.status; state.page = 1; });
  });
  el.clear.addEventListener('click', () => {
    changeView(() => { state.q = ''; el.q.value = ''; state.status = ''; state.page = 1; });
    el.q.focus();
  });
  el.retry.addEventListener('click', () => { if (state.phase !== 'loading') load('retry'); });
  el.recheck.addEventListener('click', () => { if (state.phase !== 'loading') load('recheck'); });
  const turnPage = (by) => {
    changeView(() => { state.page += by; });
    el.table.scrollIntoView({ block: 'start' });
  };
  el.prev.addEventListener('click', () => turnPage(-1));
  el.next.addEventListener('click', () => turnPage(1));
  el.rows.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const id = b.closest('tr').dataset.id;
    const act = b.dataset.act;
    if (act === 'paid' || act === 'remind') startOp(id, act);
    else if (act === 'undo') undo(id);
    else if (act === 'delete') openDelete(id);
  });
  el.delKeep.addEventListener('click', closeDelete);
  el.delConfirm.addEventListener('click', confirmDelete);
  el.del.addEventListener('cancel', (e) => {
    if (state.deleting && state.deleting.busy) e.preventDefault(); else state.deleting = null;
  });
  el.del.addEventListener('click', (e) => { if (e.target === el.del) closeDelete(); });

  // Anything still waiting out its undo period is sent when the page is left.
  window.addEventListener('pagehide', () => {
    for (const [id, op] of state.ops) if (op.phase === 'hold') commit(id);
  });
  window.addEventListener('beforeunload', (e) => {
    if (state.ops.size || (state.deleting && state.deleting.busy)) { e.preventDefault(); e.returnValue = ''; }
  });

  load();
})();
</script>
</body>
</html>
