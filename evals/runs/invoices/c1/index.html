<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices - Northwind</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --line: #dfe2e7; --line-soft: #eceef1;
    --text: #1a1f29; --muted: #5b6472;
    --accent: #1f5fbf; --accent-text: #ffffff; --accent-soft: #e6effc;
    --danger: #b3261e; --danger-soft: #fdecea;
    --ok: #17693a; --ok-soft: #e4f4ea;
    --warn-soft: #fff4d6; --warn: #7a5200;
    --neutral-soft: #eceef1;
    --focus: #1f5fbf;
    --shadow: 0 1px 2px rgba(20, 30, 50, .06);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --surface: #1b1f26; --line: #343a45; --line-soft: #282d36;
      --text: #e9ecf1; --muted: #a2abb9;
      --accent: #7fb0f5; --accent-text: #0d1b30; --accent-soft: #1d2f4a;
      --danger: #ff8a80; --danger-soft: #3d1f1d;
      --ok: #7ed6a0; --ok-soft: #173424;
      --warn-soft: #3a2f12; --warn: #f0cf7a;
      --neutral-soft: #2a2f38;
      --focus: #9cc4ff;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 24px 96px; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .org { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 26px; line-height: 1.2; margin: 2px 0 4px; }
  .summary { margin: 0; color: var(--muted); min-height: 1.45em; }
  .summary strong { color: var(--danger); font-weight: 600; }
  .refresh { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }

  button, input, select { font: inherit; color: inherit; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 34px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
  .btn.link { border-color: transparent; background: none; color: var(--accent); padding: 5px 6px; text-decoration: underline; }
  .btn[aria-disabled="true"] { opacity: .6; cursor: progress; }
  .spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls { display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .search { position: relative; flex: 1 1 300px; max-width: 420px; }
  .search input {
    width: 100%; min-height: 40px; padding: 8px 12px 8px 36px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    min-height: 36px; padding: 5px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 500;
  }
  .chip .n { color: var(--muted); font-weight: 400; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
  .sortbox { display: none; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .sortbox select { min-height: 40px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 16px; }
  .count { margin: 0 0 8px; color: var(--muted); font-size: 13px; min-height: 1.45em; }

  .banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; margin-bottom: 12px; border-radius: 8px; background: var(--danger-soft); border: 1px solid var(--danger); }
  .banner p { margin: 0; flex: 1 1 240px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .state { padding: 56px 24px; text-align: center; }
  .state h2 { font-size: 18px; margin: 0 0 6px; }
  .state p { margin: 0 auto 16px; color: var(--muted); max-width: 46ch; }
  .skel { padding: 8px 16px; }
  .skel div { height: 14px; margin: 18px 0; border-radius: 4px; background: var(--neutral-soft); animation: pulse 1.2s ease-in-out infinite alternate; }
  .skel div:nth-child(even) { width: 82%; }
  @keyframes pulse { from { opacity: .45; } to { opacity: 1; } }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line-soft); }
  thead th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  thead th:first-child { border-top-left-radius: 10px; } thead th:last-child { border-top-right-radius: 10px; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
  tbody tr:focus { outline: 2px solid var(--focus); outline-offset: -2px; }
  .th-sort { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 4px 2px; border-radius: 4px; }
  .th-sort:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .th-sort .arrow { width: 8px; opacity: .35; font-size: 10px; }
  th[aria-sort] .arrow { opacity: 1; color: var(--text); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.num .th-sort { flex-direction: row-reverse; }
  .c-number { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .c-customer { overflow-wrap: anywhere; min-width: 150px; }
  .c-date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .c-amount { font-weight: 600; }
  .c-actions { width: 1%; }
  .lbl { display: none; }
  .sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .sub.late { color: var(--danger); font-weight: 500; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .badge.overdue { background: var(--danger-soft); color: var(--danger); }
  .badge.paid { background: var(--ok-soft); color: var(--ok); }
  .badge.sent { background: var(--accent-soft); color: var(--accent); }
  .badge.draft { background: var(--neutral-soft); color: var(--muted); border: 1px dashed var(--muted); }
  .acts { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; }
  .rowerr { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--danger-soft); color: var(--text); font-size: 13px; text-align: left; min-width: 230px; white-space: normal; }
  .rowerr b { color: var(--danger); }
  .rowerr .acts { justify-content: flex-start; margin-top: 6px; }
  .rowerr .btn { min-height: 30px; padding: 3px 10px; font-size: 13px; }

  dialog { width: min(440px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); box-shadow: 0 20px 50px rgba(0, 0, 0, .3); }
  dialog::backdrop { background: rgba(10, 15, 25, .5); }
  dialog form { padding: 22px; margin: 0; }
  dialog h2 { margin: 0 0 12px; font-size: 19px; line-height: 1.3; }
  dialog dl { margin: 0 0 12px; padding: 12px 14px; background: var(--bg); border-radius: 8px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; }
  dialog dt { color: var(--muted); } dialog dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  dialog p { margin: 0 0 18px; }
  dialog .acts { gap: 8px; flex-wrap: wrap; }
  dialog .btn { min-height: 40px; padding: 8px 16px; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 10; max-width: calc(100vw - 32px); padding: 11px 16px; border-radius: 8px; background: var(--text); color: var(--bg); font-weight: 500; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); display: flex; gap: 8px; align-items: center; }
  .toast[hidden] { display: none; }
  .toast.err { background: var(--danger); color: var(--surface); }

  @media (max-width: 1000px) { .c-issued { display: none; } }

  @media (max-width: 760px) {
    .wrap { padding: 16px 12px 96px; }
    h1 { font-size: 22px; }
    .search { max-width: none; flex-basis: 100%; }
    .sortbox { display: flex; }
    .btn { min-height: 44px; padding: 8px 14px; }
    .chip { min-height: 40px; }
    .panel.has-table { background: none; border: 0; box-shadow: none; }
    table, tbody, tr, td { display: block; }
    thead { display: none; }
    tbody tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
    tbody tr:hover { background: var(--surface); }
    td { padding: 0; border: 0; }
    .c-number { grid-column: 1; grid-row: 1; }
    .c-status { grid-column: 2; grid-row: 1 / span 2; text-align: right; }
    .c-customer { grid-column: 1; grid-row: 2; }
    .c-amount { grid-column: 1 / -1; text-align: left; font-size: 20px; margin-top: 4px; }
    .c-due { grid-column: 1 / -1; color: var(--muted); }
    .c-due .sub { display: inline; margin-left: 6px; }
    .c-due .lbl { display: inline; }
    .c-actions { grid-column: 1 / -1; width: auto; }
    .c-actions:empty { display: none; }
    .c-actions > .acts { margin-top: 10px; justify-content: stretch; }
    .c-actions > .acts .btn { flex: 1; }
    .rowerr { margin-top: 10px; }
    dialog .acts { flex-direction: column-reverse; }
    dialog .acts .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .spin, .skel div { animation-duration: 3s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="org">Northwind accounts</div>
      <h1>Invoices</h1>
      <p class="summary" id="summary"></p>
    </div>
    <div class="refresh">
      <span id="updated"></span>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div class="controls" id="controls" hidden>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
      <label class="sr-only" for="q">Search by customer name or invoice number</label>
      <input id="q" type="search" placeholder="Search customer or invoice number" autocomplete="off" spellcheck="false">
    </div>
    <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
    <label class="sortbox">Sort
      <select id="sortsel">
        <option value="number:desc">Newest invoice first</option>
        <option value="number:asc">Oldest invoice first</option>
        <option value="due:asc">Due date, earliest first</option>
        <option value="due:desc">Due date, latest first</option>
        <option value="amount:desc">Amount, highest first</option>
        <option value="amount:asc">Amount, lowest first</option>
        <option value="customer:asc">Customer, A to Z</option>
        <option value="customer:desc">Customer, Z to A</option>
      </select>
    </label>
  </div>

  <div class="banner" id="banner" hidden>
    <p><b>Couldn't refresh.</b> The list below may be out of date. Check your connection and try again.</p>
    <button class="btn" type="button" id="banner-retry">Try again</button>
  </div>

  <p class="count" id="count" role="status"></p>

  <main class="panel" id="panel"></main>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form method="dialog">
    <h2 id="dlg-title"></h2>
    <dl>
      <dt>Customer</dt><dd id="dlg-customer"></dd>
      <dt>Amount</dt><dd id="dlg-amount"></dd>
    </dl>
    <p id="dlg-body"></p>
    <div class="acts">
      <button class="btn" value="cancel" id="dlg-cancel">Cancel</button>
      <button class="btn" value="ok" id="dlg-ok"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<div class="sr-only" id="alerts" role="alert"></div>

<script>
// Simulated server. Do not change this block.
const api = (() => {
  const q = new URLSearchParams(location.search);
  const wait = () => new Promise((r) => setTimeout(r, 400 + Math.random() * 1100));
  const maybeFail = (what) => {
    const f = q.get('fail');
    if (f === '1' || (f !== '0' && Math.random() < 0.2)) {
      const e = new Error('ECONNRESET: socket hang up while trying to ' + what); e.code = 'ECONNRESET'; throw e;
    }
  };
  const customers = ['Acme Ltd', 'Brightside Bakery', 'Castellan Freight and Logistics International', 'Dovetail Joinery', 'Eastfield Primary School', 'Fennel & Rye', 'Greyfriars Dental', 'Harbour Lights Hotel', 'Ivy Lane Books', 'Juniper Health'];
  const statuses = ['draft', 'sent', 'sent', 'paid', 'paid', 'paid', 'overdue', 'overdue'];
  let invoices = q.get('empty') === '1' ? [] : Array.from({ length: 46 }, (_, i) => ({
    id: 'inv_' + (9000 + i), number: 'NW-' + (2041 + i), customer: customers[i % customers.length],
    issued: new Date(2026, 8, 1 + i).toISOString(), due: new Date(2026, 9, 1 + i).toISOString(),
    amount: Math.round((120 + ((i * 7919) % 48000)) * 100) / 100 + (i % 9 === 0 ? 1250000 : 0), currency: 'GBP',
    status: statuses[i % statuses.length], reminderSentAt: null,
  }));
  return {
    async listInvoices() { await wait(); maybeFail('list invoices'); return invoices.map((x) => ({ ...x })); },
    async markPaid(id) { await wait(); maybeFail('mark paid'); const x = invoices.find((v) => v.id === id); x.status = 'paid'; return { ...x }; },
    async sendReminder(id) { await wait(); maybeFail('send reminder'); const x = invoices.find((v) => v.id === id); x.reminderSentAt = new Date().toISOString(); return { ...x }; },
    async deleteInvoice(id) { await wait(); maybeFail('delete invoice'); invoices = invoices.filter((v) => v.id !== id); return { ok: true }; },
  };
})();
</script>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const state = {
    invoices: null,          // null until first successful load
    load: 'loading',         // loading | ready | error
    refreshing: false, refreshFailed: false, updatedAt: null,
    query: '', filter: 'all',
    sort: { key: 'number', dir: 'desc' },
    pending: {},             // id -> action in flight
    errors: {},              // id -> { act, msg }
  };

  const FILTERS = [['all', 'All'], ['overdue', 'Overdue'], ['sent', 'Sent'], ['draft', 'Draft'], ['paid', 'Paid']];
  const STATUS_LABEL = { overdue: 'Overdue', sent: 'Sent', draft: 'Draft', paid: 'Paid' };
  const ACT = {
    paid: { label: 'Mark paid', busy: 'Marking paid', fail: "Couldn't mark as paid." },
    reminder: { label: 'Send reminder', busy: 'Sending', fail: "Couldn't send the reminder." },
    delete: { label: 'Delete', busy: 'Deleting', fail: "Couldn't delete this draft." },
  };

  // ---------- formatting ----------
  const money = (n, cur) => new Intl.NumberFormat('en-GB', { style: 'currency', currency: cur || 'GBP' }).format(n);
  const dateFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const timeFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' });
  const dayMonthFmt = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });
  const fmtDate = (iso) => dateFmt.format(new Date(iso));
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const daysLate = (iso) => Math.round((startOfDay(new Date()) - startOfDay(new Date(iso))) / 864e5);
  const fmtWhen = (iso) => {
    const d = new Date(iso);
    const day = startOfDay(d) === startOfDay(new Date()) ? 'today' : dayMonthFmt.format(d);
    return day + ' at ' + timeFmt.format(d);
  };
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '');

  // ---------- derived data ----------
  function matchesQuery(inv) {
    const q = state.query.trim();
    if (!q) return true;
    const words = q.toLowerCase().split(/\s+/);
    const cust = inv.customer.toLowerCase();
    if (words.every((w) => cust.includes(w))) return true;
    const nq = norm(q);
    return nq !== '' && norm(inv.number).includes(nq);
  }
  function compare(a, b) {
    const k = state.sort.key;
    let r;
    if (k === 'amount') r = a.amount - b.amount;
    else if (k === 'due') r = new Date(a.due) - new Date(b.due);
    else r = String(a[k]).localeCompare(String(b[k]), 'en-GB', { numeric: true, sensitivity: 'base' });
    if (r === 0) r = a.number.localeCompare(b.number, 'en-GB', { numeric: true });
    return state.sort.dir === 'asc' ? r : -r;
  }

  // ---------- messages ----------
  let toastTimer;
  function toast(msg, isErr) {
    const t = $('toast');
    t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : ''); t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }
  function alertSR(msg) { const a = $('alerts'); a.textContent = ''; setTimeout(() => { a.textContent = msg; }, 50); }

  // ---------- server calls ----------
  // Reads and idempotent writes get one quiet retry. Reminders do not, so a customer is never emailed twice by accident.
  async function attempt(fn, tries) {
    for (let i = 1; ; i++) {
      try { return await fn(); } catch (e) { if (i >= tries) throw e; }
    }
  }

  async function load() {
    if (state.refreshing) return;
    state.refreshing = true; state.refreshFailed = false;
    if (!state.invoices) state.load = 'loading';
    render();
    try {
      state.invoices = await attempt(() => api.listInvoices(), 2);
      state.load = 'ready'; state.updatedAt = new Date();
      for (const id of Object.keys(state.errors)) if (!state.invoices.some((v) => v.id === id)) delete state.errors[id];
    } catch (e) {
      if (state.invoices) { state.refreshFailed = true; alertSR("Couldn't refresh. The list may be out of date."); }
      else { state.load = 'error'; alertSR("Couldn't load invoices."); }
    }
    state.refreshing = false;
    render();
  }

  async function run(id, act) {
    const inv = state.invoices.find((v) => v.id === id);
    if (!inv || state.pending[id]) return;
    state.pending[id] = act; delete state.errors[id];
    render();
    try {
      if (act === 'paid') {
        const res = await attempt(() => api.markPaid(id), 2);
        replace(res);
        toast(inv.number + ' marked as paid');
      } else if (act === 'reminder') {
        const res = await api.sendReminder(id);
        replace(res);
        toast('Reminder sent to ' + inv.customer + ' for ' + inv.number);
      } else if (act === 'delete') {
        await attempt(() => api.deleteInvoice(id), 2);
        state.invoices = state.invoices.filter((v) => v.id !== id);
        toast('Draft ' + inv.number + ' deleted');
      }
    } catch (e) {
      const offline = e && e.code === 'ECONNRESET';
      const msg = ACT[act].fail + ' ' + (offline ? 'The connection to the server dropped.' : 'Something went wrong on the server.') +
        (act === 'reminder' ? ' No reminder was sent.' : ' Nothing was changed.');
      state.errors[id] = { act, msg };
      alertSR(inv.number + ': ' + msg);
      toast(inv.number + ': ' + ACT[act].fail, true);
    }
    delete state.pending[id];
    render();
  }
  function replace(res) {
    state.invoices = state.invoices.map((v) => (v.id === res.id ? res : v));
  }

  // ---------- confirmation dialog ----------
  let dlgAction = null;
  function confirmAction(inv, act) {
    const ok = $('dlg-ok');
    $('dlg-customer').textContent = inv.customer;
    $('dlg-amount').textContent = money(inv.amount, inv.currency);
    if (act === 'delete') {
      $('dlg-title').textContent = 'Delete draft ' + inv.number + '?';
      $('dlg-body').textContent = 'This permanently deletes the draft. It cannot be undone or recovered.';
      ok.textContent = 'Delete draft'; ok.className = 'btn danger solid';
    } else if (act === 'paid') {
      $('dlg-title').textContent = 'Mark ' + inv.number + ' as paid?';
      $('dlg-body').textContent = 'Check the amount matches the payment received. A paid invoice cannot be reopened from this screen.';
      ok.textContent = 'Mark as paid'; ok.className = 'btn primary';
    } else {
      $('dlg-title').textContent = 'Send another reminder for ' + inv.number + '?';
      $('dlg-body').textContent = 'A reminder was already sent ' + fmtWhen(inv.reminderSentAt) + '. The customer will be emailed again.';
      ok.textContent = 'Send another reminder'; ok.className = 'btn primary';
    }
    dlgAction = { id: inv.id, act };
    const dlg = $('dlg');
    dlg.returnValue = '';
    dlg.showModal();
    // Safe default: Cancel has focus for the permanent delete, the confirm button otherwise.
    (act === 'delete' ? $('dlg-cancel') : ok).focus();
  }
  $('dlg').querySelector('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const a = dlgAction; dlgAction = null;
    $('dlg').close();   // returns focus to the button that opened it
    if (a && e.submitter === $('dlg-ok')) run(a.id, a.act);
  });
  $('dlg').addEventListener('click', (e) => { if (e.target === $('dlg')) $('dlg').close(); });   // click on backdrop cancels

  // ---------- rendering ----------
  function rowHtml(inv) {
    const pend = state.pending[inv.id];
    const err = state.errors[inv.id];
    const late = inv.status === 'overdue' ? daysLate(inv.due) : 0;
    const acts = inv.status === 'overdue' ? ['reminder', 'paid'] : inv.status === 'sent' ? ['paid'] : inv.status === 'draft' ? ['delete'] : [];
    const btn = (a) => {
      const busy = pend === a;
      const label = a === 'reminder' && inv.reminderSentAt ? 'Remind again' : ACT[a].label;
      return '<button type="button" class="btn' + (a === 'paid' ? ' primary' : a === 'delete' ? ' danger' : '') + '"' +
        ' data-act="' + a + '" data-id="' + inv.id + '" data-key="' + inv.id + ':' + a + '"' +
        (pend ? ' aria-disabled="true"' : '') +
        ' aria-label="' + esc(label + ', ' + inv.number + ', ' + inv.customer) + '">' +
        (busy ? '<span class="spin" aria-hidden="true"></span>' + ACT[a].busy : label) + '</button>';
    };
    return '<tr data-row="' + inv.id + '" tabindex="-1">' +
      '<td class="c-number">' + esc(inv.number) + '</td>' +
      '<td class="c-customer">' + esc(inv.customer) + '</td>' +
      '<td class="c-date c-issued">' + fmtDate(inv.issued) + '</td>' +
      '<td class="c-date c-due"><span class="lbl">Due </span>' + fmtDate(inv.due) +
        (late > 0 ? '<span class="sub late">' + plural(late, 'day', 'days') + ' late</span>' : '') + '</td>' +
      '<td class="num c-amount">' + money(inv.amount, inv.currency) + '</td>' +
      '<td class="c-status"><span class="badge ' + inv.status + '">' + (STATUS_LABEL[inv.status] || esc(inv.status)) + '</span>' +
        (inv.reminderSentAt && inv.status !== 'paid' ? '<span class="sub">Reminder sent ' + fmtWhen(inv.reminderSentAt) + '</span>' : '') + '</td>' +
      '<td class="c-actions">' + (acts.length ? '<div class="acts">' + acts.map(btn).join('') + '</div>' : '') +
        (err ? '<div class="rowerr"><b>' + esc(ACT[err.act].fail) + '</b> ' + esc(err.msg.slice(ACT[err.act].fail.length + 1)) +
          '<div class="acts"><button type="button" class="btn" data-act="retry" data-id="' + inv.id + '" data-key="' + inv.id + ':retry">Try again</button>' +
          '<button type="button" class="btn link" data-act="dismiss" data-id="' + inv.id + '" data-key="' + inv.id + ':dismiss">Dismiss</button></div></div>' : '') +
      '</td></tr>';
  }

  function render() {
    const panel = $('panel');
    // Remember keyboard focus inside the list so re-rendering never drops it.
    const active = document.activeElement;
    const inPanel = active && panel.contains(active);
    const focusKey = inPanel && active.dataset.key;
    const focusRow = inPanel && active.closest('tr');
    const focusIdx = focusRow ? Array.prototype.indexOf.call(focusRow.parentNode.children, focusRow) : -1;

    const all = state.invoices || [];
    const ready = state.load === 'ready';
    const hasData = ready && all.length > 0;

    // Header
    const rb = $('refresh');
    rb.innerHTML = state.refreshing && state.invoices ? '<span class="spin" aria-hidden="true"></span>Refreshing' : 'Refresh';
    rb.setAttribute('aria-disabled', state.refreshing ? 'true' : 'false');
    rb.hidden = !state.invoices;
    $('updated').textContent = state.updatedAt ? 'Updated ' + timeFmt.format(state.updatedAt) : '';
    $('banner').hidden = !state.refreshFailed;
    $('controls').hidden = !hasData;

    if (hasData) {
      const od = all.filter((v) => v.status === 'overdue');
      const sent = all.filter((v) => v.status === 'sent');
      const sum = (xs) => money(xs.reduce((t, v) => t + v.amount, 0), xs[0] && xs[0].currency);
      $('summary').innerHTML =
        (od.length ? '<strong>' + plural(od.length, 'invoice', 'invoices') + ' overdue</strong>, ' + sum(od) + ' outstanding. ' : 'Nothing overdue. ') +
        (sent.length ? plural(sent.length, 'invoice', 'invoices') + ' sent and not yet due, ' + sum(sent) + '.' : '');
    } else $('summary').textContent = '';

    // Body
    if (state.load === 'loading') {
      panel.className = 'panel';
      panel.innerHTML = '<div class="skel" role="status" aria-label="Loading invoices">' + '<div></div>'.repeat(9) + '</div>';
      $('count').textContent = '';
      return;
    }
    if (state.load === 'error') {
      panel.className = 'panel';
      panel.innerHTML = '<div class="state"><h2>Couldn\'t load invoices</h2><p>The connection to the server dropped. Your invoices are safe; this is usually temporary.</p>' +
        '<button type="button" class="btn primary" data-act="reload" data-key="reload">Try again</button></div>';
      $('count').textContent = '';
      if (inPanel) panel.querySelector('button').focus();
      return;
    }
    if (!all.length) {
      panel.className = 'panel';
      panel.innerHTML = '<div class="state"><h2>No invoices yet</h2><p>Invoices will appear here once they have been created. If you expected to see some, refresh the list.</p>' +
        '<button type="button" class="btn" data-act="reload" data-key="reload">Refresh</button></div>';
      $('count').textContent = '';
      return;
    }

    const searched = all.filter(matchesQuery);
    const counts = { all: searched.length };
    for (const v of searched) counts[v.status] = (counts[v.status] || 0) + 1;
    $('filters').innerHTML = FILTERS.map(([k, label]) =>
      '<button type="button" class="chip" data-filter="' + k + '" aria-pressed="' + (state.filter === k) + '">' + label +
      '<span class="n">' + (counts[k] || 0) + '</span></button>').join('');
    $('sortsel').value = state.sort.key + ':' + state.sort.dir;

    const rows = searched.filter((v) => state.filter === 'all' || v.status === state.filter).sort(compare);
    const q = state.query.trim();
    const filterName = state.filter === 'all' ? '' : STATUS_LABEL[state.filter].toLowerCase() + ' ';

    if (!rows.length) {
      panel.className = 'panel';
      const elsewhere = searched.length;
      panel.innerHTML = '<div class="state"><h2>No ' + filterName + 'invoices' + (q ? ' match "' + esc(q) + '"' : '') + '</h2>' +
        '<p>' + (q ? (elsewhere && state.filter !== 'all'
            ? plural(elsewhere, 'invoice matches', 'invoices match') + ' your search under other statuses.'
            : 'Check the spelling, or search by invoice number, for example NW-2041.')
          : 'There is nothing with this status right now.') + '</p><div class="acts" style="justify-content:center">' +
        (state.filter !== 'all' ? '<button type="button" class="btn" data-act="showall" data-key="showall">Show all statuses</button>' : '') +
        (q ? '<button type="button" class="btn" data-act="clearq" data-key="clearq">Clear search</button>' : '') + '</div></div>';
      $('count').textContent = '';
      return;
    }

    $('count').textContent = rows.length === all.length ? 'Showing all ' + plural(all.length, 'invoice', 'invoices')
      : 'Showing ' + rows.length + ' of ' + plural(all.length, 'invoice', 'invoices');

    const th = (key, label, cls) => {
      const on = state.sort.key === key;
      return '<th scope="col" class="' + (cls || '') + '"' + (on ? ' aria-sort="' + (state.sort.dir === 'asc' ? 'ascending' : 'descending') + '"' : '') + '>' +
        '<button type="button" class="th-sort" data-sort="' + key + '" data-key="sort:' + key + '">' + label +
        '<span class="arrow" aria-hidden="true">' + (on ? (state.sort.dir === 'asc' ? '&#9650;' : '&#9660;') : '&#9650;') + '</span></button></th>';
    };
    panel.className = 'panel has-table';
    panel.innerHTML = '<table><caption class="sr-only">Invoices</caption><thead><tr>' +
      th('number', 'Invoice') + th('customer', 'Customer') + '<th scope="col" class="c-issued">Issued</th>' + th('due', 'Due') +
      th('amount', 'Amount', 'num') + '<th scope="col">Status</th><th scope="col"><span class="sr-only">Actions</span></th>' +
      '</tr></thead><tbody>' + rows.map(rowHtml).join('') + '</tbody></table>';

    if (inPanel) {
      const again = focusKey && panel.querySelector('[data-key="' + focusKey + '"]');
      if (again) again.focus({ preventScroll: true });
      else {
        const trs = panel.querySelectorAll('tbody tr');
        const stay = focusRow && panel.querySelector('tr[data-row="' + focusRow.dataset.row + '"]');
        const target = stay || trs[Math.min(Math.max(focusIdx, 0), trs.length - 1)];
        if (target) (target.querySelector('button') || target).focus({ preventScroll: true });
      }
    }
  }

  // ---------- events ----------
  $('panel').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.sort) {
      const k = b.dataset.sort;
      state.sort = state.sort.key === k ? { key: k, dir: state.sort.dir === 'asc' ? 'desc' : 'asc' }
        : { key: k, dir: k === 'amount' || k === 'number' ? 'desc' : 'asc' };
      return render();
    }
    const act = b.dataset.act, id = b.dataset.id;
    if (act === 'reload') return load();
    if (act === 'showall') { state.filter = 'all'; render(); return $('q').focus(); }
    if (act === 'clearq') { state.query = ''; $('q').value = ''; render(); return $('q').focus(); }
    if (!id || b.getAttribute('aria-disabled') === 'true') return;
    const inv = state.invoices.find((v) => v.id === id);
    if (!inv) return;
    if (act === 'dismiss') { delete state.errors[id]; return render(); }
    if (act === 'retry') return run(id, state.errors[id].act);   // already confirmed once
    if (act === 'reminder' && !inv.reminderSentAt) return run(id, act);
    confirmAction(inv, act);
  });
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('[data-filter]');
    if (!b) return;
    state.filter = b.dataset.filter; render();
    const again = $('filters').querySelector('[data-filter="' + state.filter + '"]');
    if (again) again.focus();
  });
  $('q').addEventListener('input', (e) => { state.query = e.target.value; render(); });
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.query) { e.preventDefault(); state.query = ''; e.target.value = ''; render(); } });
  $('sortsel').addEventListener('change', (e) => { const [key, dir] = e.target.value.split(':'); state.sort = { key, dir }; render(); });
  $('refresh').addEventListener('click', load);
  $('banner-retry').addEventListener('click', load);
  document.addEventListener('keydown', (e) => {
    if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey || $('dlg').open) return;
    const t = e.target;
    if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
    if ($('controls').hidden) return;
    e.preventDefault(); $('q').focus(); $('q').select();
  });

  load();
})();
</script>
</body>
</html>
