# Every source the rules may cite. A rule cites a source as "<id>:<locator>".
#
# held:
#   notes     distilled into sources/notes/<id>.md, in our own words
#   cited     read during research and cited by URL or paper; no notes file
#   pending   free to use, not yet distilled
#   not-held  commercial; we do not have it and rules may not cite it
#
# Licence statements marked "inferred" have not been confirmed. The repo keeps
# notes and citations, not copies of source texts.

sources:
  # Numbered guideline collections
  - id: hhs
    title: Research-Based Web Design and Usability Guidelines
    cite: US Department of Health and Human Services and GSA, enlarged edition, 2006
    licence: US government work, public domain
    held: notes
    locator: "chapter:number, for example 13:2"
    authority_for: [navigation, copy, data, forms]
    note: Each guideline carries the document's own 1 to 5 ratings for importance and strength of evidence. Predates touch and mobile.
  - id: sm86
    title: Guidelines for Designing User Interface Software
    cite: Smith and Mosier, ESD-TR-86-278, MITRE for the US Air Force, 1986
    url: https://hcibib.org/sam/
    licence: approved for public release, distribution unlimited (public domain inferred)
    held: notes
    locator: "section.subsection/item, for example 1.4/12"
    authority_for: [forms, data, feedback, tasks]
    note: Terminal era. Dated items are reworded or excluded; see the notes file.
  - id: wcag22
    title: Web Content Accessibility Guidelines 2.2
    cite: W3C Recommendation, 2023, with the Understanding documents
    url: https://www.w3.org/TR/WCAG22/
    licence: W3C document licence
    held: notes
    locator: "success criterion number, for example 3.3.1"
    authority_for: [access, forms, responsive]
  - id: act
    title: ACT Rules and the ACT Rules Format 1.1
    cite: W3C
    url: https://www.w3.org/WAI/standards-guidelines/act/rules/
    licence: W3C document licence
    held: notes
    locator: "ACT rule id"
    authority_for: [access]
    note: The model for this project's rule record.
  - id: apg
    title: WAI-ARIA Authoring Practices Guide
    cite: W3C
    url: https://www.w3.org/WAI/ARIA/apg/patterns/
    licence: W3C document licence
    held: notes
    locator: "pattern name, for example dialog-modal"
    authority_for: [access, navigation]
  - id: msux
    title: Windows User Experience Interaction Guidelines
    cite: Microsoft, Windows 7 era
    url: https://learn.microsoft.com/en-us/windows/win32/uxguide/guidelines
    licence: see sources/notes/msux.md
    held: notes
    locator: "page slug#section"
    authority_for: [copy, feedback]
    note: Desktop era. Text, message and confirmation guidance carries over; control-specific rules often do not.
  - id: bargas2010
    title: Simple but Crucial User Interfaces in the World Wide Web - Introducing 20 Guidelines for Usable Web Form Design
    cite: Bargas-Avila et al., in User Interfaces, InTech, 2010
    licence: see sources/notes/bargas2010.md
    held: notes
    locator: "guideline number"
    authority_for: [forms]
    note: The one guideline set validated as a whole in an experiment (seckler2014).
  - id: hallmark
    title: Hallmark design skill
    cite: The owner's earlier design skill, version 1.1.0, read 2026-11-16
    licence: MIT, as stated by its owner; the installed copy carries no licence file
    held: notes
    locator: "file#heading or gate number, for example slop-test.md#49"
    authority_for: [visual, pages]
    note: Mostly stated preference, not evidence. Rules that rest on it alone are marked house-preference. Claims that exist only to avoid a generated look are deferred; see sources/notes/hallmark-deferred-sameness.md.
  - id: house
    title: House rules
    cite: Decisions made while reviewing real results, recorded with their date and reasoning in sources/notes/house.md
    licence: not applicable
    held: notes
    locator: "date and a few words, for example 2026-11-16 depiction over words"
    authority_for: [copy, visual, navigation]
    note: Judgement, not evidence. Cited so that a rule resting on a house decision is not mistaken for one resting on research.
  - id: faa
    title: Human Factors Design Standard HF-STD-001B
    cite: US Federal Aviation Administration, 2016
    url: https://hf.tc.faa.gov/hfds/
    licence: approved for public release (public domain inferred)
    held: pending
    authority_for: [data, feedback]

