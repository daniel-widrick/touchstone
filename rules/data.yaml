domain: data
prefix: DATA
title: Data display, hierarchy and density
load_when: "Any screen that shows records, tables, lists, metrics or charts, and any dashboard."
rules:
  - id: DATA-001
    rule: "The thing the user came to the screen for comes first and has the most visual weight."
    why: "When everything is the same size, or decoration outranks the task, people must search for the point of the screen."
    applies_when: "A screen has more than one section or block."
    pass_when: "The primary content or task is the first block in reading order and the most prominent; secondary material is smaller or lower."
    evidence: judgment
    severity: major
    support: some-support
    sources: ["hhs:6:5", "hhs:6:3", "sm86:2.5/16", "hhs:12:2", "catalog:B6.2"]
    counters: [B6.1, B6.2, B6.8, B6.4]
    examples:
      pass: "An invoices screen that opens on the invoice table with its filter."
      fail: "A large ring chart and four stat cards above a table that starts below the fold."
      na: "A screen with a single block."

  - id: DATA-002
    rule: "A screen opens on what the user came for."
    why: "A welcome banner or decorative opening pushes the point of the screen down and says nothing."
    applies_when: "Always."
    pass_when: "On a working screen there is no hero section, greeting banner or introductory panel above the working content. On a page that presents something, the opening is the statement of what it is and the next step (see PAGE-001 and PAGE-002), sized to its content and not to the height of the window."
    evidence: judgment
    severity: major
    support: practice-consensus
    sources: ["catalog:B4.2", "hhs:6:3", "msux:top-violations#Wizard pages"]
    counters: [B4.2, B6.8, A6]
    examples:
      pass: "Heading 'Orders', then the orders."
      fail: "A gradient panel reading 'Welcome to your dashboard' with a subtitle and two buttons; a landing page whose opening fills the window with a slogan."
      na: "Never; this rule always applies."

  - id: DATA-003
    rule: "Each number, card or chart on the screen answers a question the user has for the task."
    why: "Decorative metrics take the most space and deliver the least."
    applies_when: "The screen shows summary numbers, stat cards or charts."
    pass_when: "For each one, the decision or action it informs can be named; the rest are removed."
    evidence: judgment
    severity: major
    support: practice-consensus
    sources: ["sm86:2.0/2", "hhs:16:7", "hhs:6:1", "catalog:B6.3"]
    counters: [B6.3, B5.7, B6.7]
    examples:
      pass: "'3 invoices overdue' linking to the overdue list."
      fail: "Four equal cards: Total Users, Total Revenue, Active Sessions, Growth, each with a sparkline."
      na: "No summary numbers or charts."

  - id: DATA-004
    rule: "Related items are grouped, groups are separated by space, and elements line up on a few shared edges."
    why: "Grouping and alignment are the strongest measured predictors of how fast people find things on a screen."
    applies_when: "A screen has more than a handful of elements."
    pass_when: "Items that belong together are nearer each other than to other groups; left edges and baselines fall on a small number of lines."
    evidence: judgment
    severity: major
    support: well-replicated
    sources: ["tullis1983", "parush1998", "hhs:16:4", "hhs:6:7", "sm86:2.5/3", "sm86:2.5/12"]
    counters: [B6.6, B6.5]
    examples:
      pass: "Billing fields in one block, contact fields in another, with a clear gap between and one left edge."
      fail: "Even 16px gaps between every element so nothing reads as a group."
      na: "A screen with one or two elements."

  - id: DATA-005
    rule: "Density suits the task: screens for scanning and comparing are compact."
    why: "Generous padding on a working list means scrolling to compare what would fit in one view."
    applies_when: "A screen lists records to scan, compare or act on."
    pass_when: "At 1280x800 a table or list shows at least about ten records without scrolling, with row height at most about 48px."
    evidence: measured
    severity: minor
    support: some-support
    sources: ["hhs:6:11", "hhs:6:6", "hhs:6:4", "carbon:components/data-table/usage"]
    counters: [B6.3, A4]
    dissent: "The same source warns against crowding so tight that targets are hard to find; density is a balance."
    examples:
      pass: "A table with 40px rows showing 14 invoices."
      fail: "Each record as a large card, three visible per screen."
      na: "No record lists."

  - id: DATA-006
    rule: "Tabular data is a table with header cells."
    why: "Without headers neither sighted nor screen reader users know what a column means."
    applies_when: "The screen shows rows of records with the same attributes."
    pass_when: "It uses a table with th cells for columns (and rows where they are labeled), each with a short descriptive heading."
    evidence: dom
    check: table-headers
    severity: major
    support: practice-consensus
    sources: ["wcag22:1.3.1", "hhs:9:6", "sm86:2.3/6", "sm86:2.3/1"]
    counters: [B10.6]
    examples:
      pass: "<th scope=\"col\">Due date</th>"
      fail: "A grid of divs, or a table whose first row is td cells in bold."
      na: "No tabular data."

  - id: DATA-007
    rule: "The first column is what people identify the record by, and text is left-aligned, numbers right-aligned."
    why: "People look a row up by its name and compare numbers by their digits lining up."
    applies_when: "The screen has a table."
    pass_when: "Column one is a human-readable name or reference, not an internal id; numeric columns are right-aligned with tabular figures."
    evidence: dom
    severity: minor
    support: practice-consensus
    sources: ["nng:data-tables", "sm86:2.3/4", "sm86:2.3/15", "sm86:2.3/16", "vercel:guidelines"]
    counters: [B6.5]
    examples:
      pass: "Customer, Invoice, Due, Amount (right-aligned)."
      fail: "A UUID in column one; amounts left-aligned."
      na: "No tables."

  - id: DATA-008
    rule: "Values are shown ready to use: formatted, with units, the same way everywhere."
    why: "People should not convert, decode or guess."
    applies_when: "The screen shows dates, times, money, quantities or codes."
    pass_when: "Dates, numbers and currency are formatted for the user's locale, units are shown, relative times offer the exact time, and the same item is formatted identically across screens."
    evidence: judgment
    severity: minor
    support: practice-consensus
    sources: ["sm86:2.0/3", "sm86:2.2/10", "hhs:2:8", "hhs:11:2", "sm86:1.0/16"]
    counters: [B5.5]
    examples:
      pass: "'12 Mar 2026', '1,204.50 GBP', '3 hours ago' with the exact time on hover and focus."
      fail: "'2026-03-12T09:14:22.000Z', '1204.5', a bare '42' with no unit."
      na: "No formatted values."

  - id: DATA-009
    rule: "Column headings stay in view while a long table scrolls."
    why: "Once the headers scroll away the columns lose their meaning."
    applies_when: "A table can be taller than the viewport."
    pass_when: "Scrolling the table keeps the header row visible."
    evidence: walk
    severity: minor
    support: practice-consensus
    sources: ["sm86:2.7.2/4", "hhs:16:3", "nng:data-tables"]
    counters: [B5.5]
    examples:
      pass: "A sticky header row."
      fail: "Row 60 of a table with no visible headings."
      na: "Tables that always fit in view."

  - id: DATA-010
    rule: "When a view is filtered, sorted or has columns hidden, it says so and offers one action to clear it."
    why: "People mistake a filtered list for the whole list."
    applies_when: "A view can be filtered, searched or reduced."
    pass_when: "Active filters are visible as text near the results with a clear-all control, and the result count is shown."
    evidence: walk
    severity: major
    support: practice-consensus
    sources: ["sm86:2.7.4/2", "sm86:2.7.4/4", "nng:data-tables", "hhs:9:8"]
    counters: [B5.1]
    examples:
      pass: "'Status: Overdue  x' and 'Clear filters' above '12 of 312 invoices'."
      fail: "A filter chosen in a closed dropdown with no other sign that the list is filtered."
      na: "Views with no filtering."

  - id: DATA-011
    rule: "Each row shows its one or two most used actions directly; the rest sit in one labeled menu."
    why: "Row actions hidden in a hover state or a generic menu are slow to find and unusable on touch."
    applies_when: "Table or list rows have actions."
    pass_when: "At most two actions are visible per row as labeled controls; further actions are in a single menu button with an accessible name; none appear only on hover."
    evidence: dom
    check: hover-only
    severity: minor
    support: practice-consensus
    sources: ["nng:data-tables", "carbon:components/data-table/usage", "shopify:layout"]
    counters: [B1.1]
    examples:
      pass: "'Edit' and a 'More actions' menu on each row."
      fail: "Six icon buttons per row, or actions that appear only on row hover."
      na: "Rows have no actions."

  - id: DATA-012
    rule: "Lists that people search, compare or return to are paged or loaded on request, not by endless scroll."
    why: "Endless scroll loses position and makes the footer and the end unreachable."
    applies_when: "A list is longer than a few screens and is used to find or compare items."
    pass_when: "The list uses pagination or a 'Load more' control, and the position survives Back."
    evidence: walk
    severity: minor
    support: practice-consensus
    sources: ["nng:infinite-scrolling-tips", "hhs:8:5"]
    counters: [B5.1]
    exceptions: ["Feeds browsed without a goal."]
    examples:
      pass: "50 rows per page with page controls."
      fail: "An orders table that appends rows for ever as you scroll."
      na: "Short lists."

  - id: DATA-013
    rule: "A chart labels its axes and units and makes the exact values available."
    why: "A chart without labels or values is a decoration."
    applies_when: "The screen shows a chart."
    pass_when: "Axes or series are labeled with what they measure and the unit, and values can be read from labels, a table or a focusable tooltip."
    evidence: dom
    severity: minor
    support: some-support
    sources: ["hhs:14:10", "sm86:2.4.1/3", "hhs:16:6"]
    counters: [B5.7]
    examples:
      pass: "A bar chart titled 'Invoices paid per month' with labeled axes and a 'View as table' link."
      fail: "An unlabeled sparkline beside a number."
      na: "No charts."

  - id: DATA-014
    rule: "Emphasis is rare and means one thing."
    why: "Highlighting many things highlights none, and mixed codes cannot be learned."
    applies_when: "The screen uses color, bold, badges or icons to mark some items."
    pass_when: "Only items needing attention are emphasized, each kind of emphasis has one meaning across screens, and every badge reflects real state."
    evidence: judgment
    severity: minor
    support: some-support
    sources: ["hhs:11:5", "hhs:11:11", "sm86:2.6/1", "sm86:2.6/7", "sm86:2.6/28", "hhs:9:5"]
    counters: [A8, A9, B6.1]
    examples:
      pass: "Only overdue invoices carry a badge."
      fail: "Every row has a colored status pill, a bold amount and an icon."
      na: "No emphasis used."

  - id: DATA-015
    rule: "A mark the product uses in its own sense is explained where it is used, and means one thing everywhere."
    why: "A symbol or color code people have not met is a puzzle until it is defined, and one that changes meaning between screens is worse than none."
    applies_when: "The screen uses symbols, shapes or colors whose meaning is specific to this product: category marks on a map, status colors, badges."
    pass_when: "Each such mark is labeled directly beside the thing it marks where space allows; otherwise a legend showing the mark itself sits in the same view, next to the display it explains. The same mark carries the same meaning on every screen."
    evidence: dom
    severity: major
    support: some-support
    sources: ["sm86:2.6/6", "sm86:2.4/12", "sm86:2.6/7", "sm86:2.4.3/3", "sm86:2.4.4/8", "sm86:2.4.8/4", "hhs:11:9"]
    counters: [B1.2, A8]
    examples:
      pass: "Filter chips reading 'Police', 'Fire' and 'Medical', each with its mark, directly above the map and the list that use those marks."
      fail: "Colored dots on a map with no key; a shield that means 'police' on one screen and 'verified' on another."
      na: "No product-specific marks or color codes."
