domain: responsive
prefix: RESP
title: Small screens and touch
load_when: "Any screen that may be used on a phone or in a narrow window. Check at 375px and 320px wide."
rules:
  - id: RESP-001
    rule: "Content fits the width of the screen down to 320 CSS pixels, with no sideways scrolling."
    why: "Sideways scrolling hides content and controls and is the clearest sign a screen was only tried on desktop."
    applies_when: "Always."
    pass_when: "At 320px and 375px wide the document is no wider than the viewport. Wide tables scroll inside their own container."
    evidence: measured
    check: horizontal-scroll
    severity: major
    support: some-support
    sources: ["wcag22:1.4.10", "hhs:8:1", "hhs:6:8"]
    counters: [B10.1]
    exceptions: ["Content that needs two dimensions, such as a map or a wide data table, inside a scrolling region of its own."]
    examples:
      pass: "A table wrapped in a container with overflow-x: auto."
      fail: "A fixed 1200px wrapper, or a toolbar whose buttons run off the right edge."
      na: "Never; this rule always applies."

  - id: RESP-002
    rule: "The user can zoom the page."
    why: "Disabling zoom locks out people who need larger text."
    applies_when: "Always."
    pass_when: "The viewport meta tag has no user-scalable=no and no maximum-scale below 2, and text can be enlarged to 200 percent without loss."
    evidence: dom
    check: zoom-disabled
    severity: major
    support: practice-consensus
    sources: ["wcag22:1.4.4", "vercel:guidelines"]
    counters: [B10.4]
    examples:
      pass: "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"
      fail: "content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\""
      na: "Never; this rule always applies."

  - id: RESP-003
    rule: "Text in fields is at least 16 pixels on phones."
    why: "Smaller field text makes iOS zoom the page on focus, which shifts the layout."
    applies_when: "The screen has fields and the viewport is 480px wide or less."
    pass_when: "The computed font size of every input, select and textarea is 16px or more."
    evidence: measured
    check: small-input-font
    severity: minor
    support: practice-consensus
    sources: ["vercel:guidelines", "hhs:11:8"]
    counters: [B10.1]
    examples:
      pass: "input { font-size: 16px }"
      fail: "input { font-size: 13px }"
      na: "No fields."

  - id: RESP-004
    rule: "On touch screens, the controls people use most are at least 44 pixels in their smaller dimension."
    why: "Thumb accuracy stops improving only at around 9 to 10 millimetres."
    applies_when: "The viewport is 480px wide or less and the screen has primary controls."
    pass_when: "Primary buttons, navigation items and row actions measure at least 44px in height and width, or have equivalent padding."
    evidence: measured
    severity: minor
    support: well-replicated
    sources: ["parhi2006", "wcag22:2.5.5", "apple:accessibility", "android:guide/topics/ui/accessibility/apps"]
    counters: [B2.5]
    dissent: "WCAG AA requires only 24px; 44px is its AAA level and Apple's default."
    examples:
      pass: "Buttons with min-height: 44px at phone widths."
      fail: "28px tall buttons in a mobile toolbar."
      na: "A desktop-only tool whose brief excludes phones."

  - id: RESP-005
    rule: "Every task that works on desktop can be completed at 375 pixels wide."
    why: "A layout that merely fits is not the same as one that can be used."
    applies_when: "The product may be used on a phone."
    pass_when: "At 375px wide each task can be finished: navigation is reachable, tables are readable or reflow, dialogs fit and scroll, and no control is cut off or covered."
    evidence: walk
    severity: major
    support: practice-consensus
    sources: ["catalogue:B10.1", "wcag22:1.4.10", "nng:modal-nonmodal-dialog"]
    counters: [B10.1]
    examples:
      pass: "The sidebar becomes a menu button plus visible links to the two main sections; table rows become stacked label and value pairs."
      fail: "A dialog taller than the screen whose buttons cannot be reached."
      na: "A desktop-only tool whose brief excludes phones."

  - id: RESP-006
    rule: "Fixed and sticky elements leave the content and controls beneath them reachable."
    why: "A sticky bar or floating button that covers the last row or the submit button blocks the task."
    applies_when: "The screen has fixed or sticky elements."
    pass_when: "At 375x667 and at 1280x600, scrolling to the end shows all content clear of fixed elements, and fixed elements together take less than about a third of the height."
    evidence: walk
    severity: major
    support: practice-consensus
    sources: ["catalogue:B10.2", "wcag22:2.4.11"]
    counters: [B10.2]
    examples:
      pass: "Bottom padding equal to the height of the sticky save bar."
      fail: "A chat bubble covering the 'Next' button on phones."
      na: "No fixed or sticky elements."
